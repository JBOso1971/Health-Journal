<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Health Journal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── DESIGN TOKENS ──────────────────────────────────────────────── */
    :root {
      --navy-dark:  #0d1b2a;
      --navy-mid:   #1b2d45;
      --navy-light: #243447;
      --navy-edge:  #0a1623;
      --accent:        #2a6496;
      --accent-bright: #3a8fd1;
      --accent-tint:   #eef4f9;
      --paper:      #f4f1ea;
      --paper-2:    #fbf8f1;
      --paper-edge: #ece7dc;
      --paper-line: #d6cfbf;
      --paper-hold: #f7eee0;
      --ink:        #1e293b;
      --ink-dim:    #5b6776;
      --ink-muted:  #94a3b8;
      --on-navy-fg:     #e6edf3;
      --on-navy-fg-dim: #94a3b8;
      --state-ok:      #22c55e;
      --state-warn:    #d97706;
      --state-err:     #dc2626;
      --state-pending: #cbd5e1;
      --confirm-bg: #eef7ee;
      --s-1:2px; --s-2:4px; --s-3:6px; --s-4:8px; --s-5:10px;
      --s-6:12px; --s-7:14px; --s-8:16px; --s-9:18px; --s-10:20px;
      --s-11:24px; --s-12:28px; --s-13:32px; --s-14:40px;
      --bw-hair:1px; --bw-rule:1.5px; --bw-emph:3px;
      --r-0:0; --r-1:2px; --r-full:9999px;
      --rule-solid:  1px solid var(--paper-line);
      --rule-dashed: 1px dashed var(--paper-line);
      --rule-dotted: 1px dotted var(--paper-line);
      --shadow-frame: 0 30px 80px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
      --font-sans:  'Inter', Arial, system-ui, sans-serif;
      --font-serif: Georgia, 'Noto Serif', serif;
      --font-mono:  'JetBrains Mono', 'Roboto Mono', ui-monospace, monospace;
    }

    /* ── RESET ────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%; background: var(--navy-edge);
      font-family: var(--font-sans); color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;   /* A1: kill pull-to-refresh (11 Jul data loss) */
    }

    /* ── APP SHELL ────────────────────────────────────────────────── */
    .app-shell {
      width: 100%; max-width: 480px; margin: 0 auto;
      min-height: 100dvh; min-height: 100vh;
      background: var(--paper-edge); position: relative;
    }
    .scroll {
      height: 100dvh; height: 100vh;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 150px;
      overscroll-behavior-y: contain;   /* A1: kill pull-to-refresh on the scroller */
    }
    .scroll--nofooter { padding-bottom: 0; }

    /* ── HEADER ───────────────────────────────────────────────────── */
    .med-header {
      background: var(--navy-dark); color: var(--on-navy-fg);
      padding: max(env(safe-area-inset-top, 0px) + 16px, 24px) var(--s-10) var(--s-9);
      border-bottom: 1px solid var(--accent);
      position: sticky; top: 0; z-index: 20;
    }
    .med-header__top {
      display: flex; align-items: center; gap: var(--s-5);
      margin-bottom: var(--s-7);
    }
    .rx-badge {
      width: 24px; height: 24px;
      border: 1.5px solid var(--accent-bright);
      display: inline-grid; place-items: center;
      font-family: var(--font-serif); font-size: 13px;
      color: var(--accent-bright); flex-shrink: 0;
    }
    .rx-badge--confirm {
      width: 44px; height: 44px; border-radius: var(--r-full);
      border: 2px solid var(--state-ok); color: var(--state-ok); font-size: 22px;
    }
    .header-eyebrow {
      font: 600 9px/1.2 var(--font-sans);
      letter-spacing: .18em; text-transform: uppercase; color: var(--on-navy-fg-dim);
    }
    .header-sync {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
      font: 400 11.5px/1 var(--font-mono); color: var(--on-navy-fg-dim);
    }
    .header-sync__dot {
      width: 6px; height: 6px; border-radius: var(--r-full); background: var(--state-ok);
    }
    .header-breadcrumb {
      margin-left: auto; font: 400 11.5px/1 var(--font-mono); color: var(--on-navy-fg-dim);
      background: none; border: none; cursor: pointer; padding: 4px 0;
    }
    .header-breadcrumb:active { opacity: .7; }
    .header-sub {
      font: 600 10px/1.2 var(--font-sans); letter-spacing: .18em;
      text-transform: uppercase; color: var(--on-navy-fg-dim); margin-bottom: var(--s-2);
    }
    .header-title { font: 500 26px/1.1 var(--font-serif); color: var(--on-navy-fg); }
    .header-meta-strip {
      margin-top: var(--s-7); padding-top: var(--s-7);
      border-top: 1px solid var(--navy-light);
      display: flex; gap: var(--s-9);
    }
    .header-meta-item { display: flex; flex-direction: column; gap: 3px; }
    .header-meta-label {
      font: 600 9px/1.2 var(--font-sans); letter-spacing: .18em;
      text-transform: uppercase; color: var(--on-navy-fg-dim);
    }
    .header-meta-val { font: 400 13px/1 var(--font-mono); color: var(--on-navy-fg); }

    /* ── SECTIONS ─────────────────────────────────────────────────── */
    .section { background: var(--paper); border-bottom: var(--rule-solid); }
    .section-head {
      display: flex; align-items: baseline; gap: var(--s-5);
      padding: var(--s-9) var(--s-9) var(--s-5);
      border-bottom: var(--rule-solid); background: var(--paper-edge);
    }
    .section-head__no {
      font: 600 9px/1.2 var(--font-sans); letter-spacing: .18em;
      text-transform: uppercase; color: var(--ink-dim); min-width: 20px;
    }
    .section-head__title { font: 600 15px/1.1 var(--font-serif); color: var(--ink); }
    .section-head__right {
      margin-left: auto; font: 600 9px/1.2 var(--font-sans);
      letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim);
    }

    /* ── ENTRY-CLASS BUTTON ───────────────────────────────────────── */
    .entry-class {
      width: 100%; display: grid; grid-template-columns: 44px 1fr auto;
      align-items: center; padding: var(--s-7) var(--s-9);
      background: var(--paper-2); border: none; border-bottom: var(--rule-solid);
      cursor: pointer; text-align: left; transition: background 120ms ease-out;
    }
    .entry-class:last-child { border-bottom: none; }
    .entry-class:hover  { background: var(--paper); }
    .entry-class:active { background: var(--paper-edge); }
    .entry-class:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .entry-class__code {
      width: 36px; height: 36px; display: inline-grid; place-items: center;
      background: var(--paper-2); border: 1px solid var(--paper-line);
      font: 600 15px/1 var(--font-sans); color: var(--ink);
    }
    .entry-class__body { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--s-6); }
    .entry-class__name { font: 600 17px/1.2 var(--font-serif); color: var(--ink); }
    .entry-class__sub  { font: 400 11.5px/1.4 var(--font-sans); color: var(--ink-dim); }
    .entry-class__chev {
      font: 400 16px/1 var(--font-mono); color: var(--accent);
      transition: color 120ms ease-out;
    }
    .entry-class:hover .entry-class__chev { color: var(--accent-bright); }

    /* ── INTERVENTION ROW ─────────────────────────────────────────── */
    .intervention {
      display: grid; grid-template-columns: 48px 1fr auto;
      grid-template-rows: auto auto; column-gap: var(--s-6); row-gap: var(--s-2);
      padding: var(--s-7) var(--s-9); border-bottom: var(--rule-solid); background: var(--paper);
    }
    .intervention:last-child { border-bottom: none; }
    .intervention__code {
      grid-row: 1 / 3; display: flex; align-items: center; justify-content: center;
      font: 400 11px/1 var(--font-mono); color: var(--ink-dim); align-self: center;
    }
    .intervention__type  { font: 400 16px/1.35 var(--font-serif); color: var(--ink); }
    .intervention__value { font: 400 16px/1.35 var(--font-serif); color: var(--ink); text-align: right; }
    .intervention__admin { font: 400 11px/1.3 var(--font-mono); color: var(--ink-dim); }
    .intervention__pill  { display: flex; justify-content: flex-end; }

    /* ── STATE PILL ───────────────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 7px; border-radius: var(--r-1);
      font: 400 10px/1 var(--font-mono); letter-spacing: .14em; background: #fff;
    }
    .pill::before { content: ''; width: 6px; height: 6px; border-radius: var(--r-full); }
    .pill--active   { color: var(--state-warn); border: 1px solid rgba(217,119,6,.33); }
    .pill--active::before   { background: var(--state-warn); }
    .pill--complete { color: var(--state-ok);   border: 1px solid rgba(34,197,94,.33); }
    .pill--complete::before { background: var(--state-ok); }
    .pill--pending  { color: var(--ink-dim);    border: 1px solid rgba(203,213,225,.5); }
    .pill--pending::before  { background: var(--state-pending); }

    /* ── OPTION ROW ───────────────────────────────────────────────── */
    .option-row {
      display: grid; grid-template-columns: 34px 1fr auto;
      column-gap: var(--s-7); align-items: center;
      padding: var(--s-7) var(--s-9); background: #fff; border-bottom: var(--rule-solid);
      border-left: 3px solid transparent; cursor: pointer;
      transition: background 160ms ease-out, border-left-color 160ms ease-out;
    }
    .option-row:last-child { border-bottom: none; }
    .option-row:hover { background: var(--paper-2); }
    .option-row[aria-selected="true"] { background: var(--accent-tint); border-left-color: var(--accent); }
    .option-row:focus-visible { border-left-color: var(--accent-bright); outline: none; }
    .radio-circle {
      width: 22px; height: 22px; border-radius: var(--r-full);
      border: 1.5px solid var(--paper-line); background: #fff;
      display: inline-grid; place-items: center; flex-shrink: 0;
      transition: all 160ms ease-out;
    }
    .option-row[aria-selected="true"] .radio-circle {
      border-color: var(--accent); background: var(--accent); color: #fff; font-size: 12px;
    }
    .option-row__body { display: flex; flex-direction: column; gap: 2px; }
    .option-row__name { font: 600 17px/1.2 var(--font-serif); color: var(--ink); }
    .option-row__sub  { font: 400 11.5px/1.4 var(--font-sans); color: var(--ink-dim); }
    .option-row__code { font: 400 11px/1 var(--font-mono); color: var(--ink-dim); }

    /* ── CHIPS ────────────────────────────────────────────────────── */
    .chips { display: flex; margin: var(--s-9); border: 1px solid var(--paper-line); }
    .chip {
      flex: 1 1 0; padding: var(--s-5) var(--s-5);
      text-align: center; font: 400 12px/1.3 var(--font-mono);
      background: #fff; color: var(--ink); border: none; cursor: pointer;
      transition: background 120ms ease-out;
    }
    .chips .chip + .chip { border-left: 1px solid var(--paper-line); }
    .chip:hover { background: var(--paper-2); }
    .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .chip:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: -2px; }

    /* ── FIELD GRID ───────────────────────────────────────────────── */
    .field-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      column-gap: var(--s-9); row-gap: var(--s-8); padding: var(--s-7) var(--s-9);
    }
    .field-grid--3 { grid-template-columns: 1fr 1fr 1fr; column-gap: var(--s-7); }
    .field-grid--1 { grid-template-columns: 1fr; }

    /* ── INPUT CELL ───────────────────────────────────────────────── */
    .cell { display: flex; flex-direction: column; min-width: 0; }
    .cell__label {
      font: 600 10px/1.2 var(--font-sans); letter-spacing: .18em;
      text-transform: uppercase; color: var(--ink-dim);
    }
    .cell__value {
      margin-top: 4px; padding: 0 0 5px;
      border: none; border-bottom: var(--rule-dotted);
      background: transparent; font: 400 17px/1.2 var(--font-serif);
      color: var(--ink); outline: none; width: 100%;
    }
    .cell__value--mono { font: 400 13px/1.3 var(--font-mono); }
    .cell__value:focus { border-bottom: 1px solid var(--accent); }
    .cell__value[aria-invalid="true"] { border-bottom: 1px solid var(--state-err); color: var(--state-err); }
    .cell__value:disabled { color: var(--ink-dim); }
    .cell__hint { font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-dim); margin-top: 3px; }

    /* ── SUPPLEMENT ROW ───────────────────────────────────────────── */
    .supplement-row {
      display: grid; grid-template-columns: 28px 1fr 28px;
      column-gap: var(--s-6); align-items: center;
      padding: var(--s-7) var(--s-9); background: #fff;
      border-bottom: var(--rule-solid); transition: background 120ms;
    }
    .supplement-row:last-child { border-bottom: none; }
    .supplement-row--checked { background: var(--paper-2); }
    .supplement-row--hold    { background: var(--paper-hold); }
    .supplement-check {
      width: 26px; height: 26px; display: inline-grid; place-items: center;
      border: 1.5px solid var(--paper-line); background: #fff; cursor: pointer;
      flex-shrink: 0; transition: all 120ms; font: 700 16px/1 var(--font-sans);
    }
    .supplement-check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .supplement-check:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
    .supplement-row__body { display: flex; flex-direction: column; gap: 2px; }
    .supplement-row__name { font: 400 16px/1.35 var(--font-serif); color: var(--ink); }
    .supplement-row__meta { font: 400 11px/1.3 var(--font-mono); color: var(--ink-dim); }
    .supplement-row__idx  { font: 400 11px/1.3 var(--font-mono); color: var(--ink-dim); text-align: right; }
    .hold-tag {
      font: 400 9px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase;
      color: var(--state-warn); border: 1px solid rgba(217,119,6,.33);
      padding: 1px 5px; display: inline-block; margin-left: 6px;
    }

    /* ── ANNOTATION ───────────────────────────────────────────────── */
    .annotation-wrap { padding: var(--s-9); }
    .annotation {
      border-top: var(--rule-dashed); border-bottom: var(--rule-dashed);
      padding: var(--s-6) 0; width: 100%; background: transparent;
      resize: none; outline: none; font: italic 400 13.5px/1.5 var(--font-serif);
      color: var(--ink-dim); display: block; min-height: 72px;
    }
    .annotation:focus { color: var(--ink); }
    .annotation-meta {
      margin-top: 8px; display: flex; justify-content: space-between;
      font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-dim);
    }

    /* ── PROGRESS BAR ─────────────────────────────────────────────── */
    .progress-wrap { padding: 0 var(--s-9) var(--s-7); }
    .progress {
      height: 6px; background: var(--paper-edge);
      border: 1px solid var(--paper-line); position: relative;
    }
    .progress__fill {
      position: absolute; inset: 0 auto 0 0;
      background: var(--state-warn); width: var(--progress, 0%);
      transition: width 240ms cubic-bezier(.2,0,0,1);
    }
    .progress__label {
      font: 400 10px/1 var(--font-mono); color: var(--ink-dim);
      margin-top: 5px; text-align: right;
    }

    /* ── SIGN-AND-FILE FOOTER ─────────────────────────────────────── */
    .sign-and-file {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 0; width: 100%; max-width: 480px;
      background: var(--navy-dark); border-top: 1px solid var(--accent);
      padding: var(--s-7) var(--s-9) calc(var(--s-8) + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; gap: var(--s-5); z-index: 30;
    }
    .saf-meta { display: flex; justify-content: space-between; align-items: flex-end; }
    .saf-sig { display: flex; flex-direction: column; gap: 3px; }
    .saf-sig__label {
      font: 600 9px/1.2 var(--font-sans); letter-spacing: .18em;
      text-transform: uppercase; color: var(--on-navy-fg-dim);
    }
    .saf-sig__name {
      font: 400 13px/1.3 var(--font-serif); color: var(--on-navy-fg);
      border-bottom: 1px solid var(--ink-muted); padding-bottom: 3px; width: 140px;
    }
    .saf-time { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
    .saf-time__label {
      font: 600 9px/1.2 var(--font-sans); letter-spacing: .18em;
      text-transform: uppercase; color: var(--on-navy-fg-dim);
    }
    .saf-time__val { font: 400 13px/1 var(--font-mono); color: var(--on-navy-fg); }

    /* ── BUTTONS ──────────────────────────────────────────────────── */
    .btn-primary {
      width: 100%; padding: 15px var(--s-8);
      background: var(--accent-bright); color: #fff;
      border: none; border-radius: var(--r-1);
      font: 700 14px/1 var(--font-sans); letter-spacing: .22em; text-transform: uppercase;
      cursor: pointer; transition: background 120ms ease-out, transform 80ms ease-out;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover  { background: #4a9fe1; }
    .btn-primary:active { background: var(--accent); transform: translateY(1px); }
    .btn-primary:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
    .btn-primary:disabled { background: var(--ink-muted); cursor: not-allowed; transform: none; }
    .btn-secondary {
      width: 100%; padding: 14px var(--s-6);
      background: transparent; color: var(--on-navy-fg);
      border: 1px solid var(--ink-muted); border-radius: var(--r-1);
      font: 600 11.5px/1 var(--font-sans); letter-spacing: .18em; text-transform: uppercase;
      cursor: pointer; transition: background 120ms;
    }
    .btn-secondary:hover  { background: rgba(255,255,255,.06); }
    .btn-secondary:active { opacity: .7; }

    /* ── ERROR BAND ───────────────────────────────────────────────── */
    .err-band {
      font: 400 11.5px/1.3 var(--font-mono); color: var(--state-err);
      background: var(--paper-hold); border-top: 1px solid var(--state-err);
      padding: var(--s-5) var(--s-9); display: none;
    }
    .err-band.show { display: block; }

    /* ── AUDIT FOOTER ─────────────────────────────────────────────── */
    .audit-footer {
      background: var(--paper-edge);
      padding: var(--s-8) var(--s-9) var(--s-14);
      font: 400 10.5px/1.8 var(--font-mono); color: var(--ink-dim);
    }
    .audit-footer .ok { color: var(--state-ok); }

    /* ── SPINNER ──────────────────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 700ms linear infinite; }

    /* ── NUMBER ROW ───────────────────────────────────────────────── */
    .num-row {
      display: flex; align-items: center; gap: var(--s-6);
      padding: var(--s-7) var(--s-9);
    }
    .num-btn {
      width: 40px; height: 40px; border: 1px solid var(--paper-line);
      background: var(--paper-2); color: var(--ink); font-size: 22px;
      cursor: pointer; display: inline-grid; place-items: center;
      border-radius: var(--r-1); flex-shrink: 0; transition: background 120ms;
    }
    .num-btn:hover  { background: var(--paper-edge); }
    .num-btn:active { background: var(--paper-line); }
    .num-val { flex: 1; text-align: center; font: 500 30px/1 var(--font-serif); color: var(--ink); }
    .num-unit { font: 400 11px/1 var(--font-mono); color: var(--ink-dim); }

    /* ── FAST ACTIVE BANNER ───────────────────────────────────────── */
    .fast-banner {
      background: var(--navy-mid); border-bottom: 1px solid var(--accent);
      padding: var(--s-7) var(--s-9); display: flex; align-items: center; gap: var(--s-6);
    }
    .fast-banner__code { font: 400 11px/1 var(--font-mono); color: var(--on-navy-fg-dim); min-width: 32px; }
    .fast-banner__body { flex: 1; min-width: 0; }
    .fast-banner__type { font: 600 14px/1.2 var(--font-serif); color: var(--on-navy-fg); }
    .fast-banner__timer { font: 400 13px/1 var(--font-mono); color: var(--state-warn); margin-top: 2px; }
    .fast-banner__end {
      background: none; border: 1px solid rgba(220,38,38,.5); border-radius: var(--r-1);
      color: #fca5a5; font: 600 10px/1 var(--font-sans);
      letter-spacing: .14em; text-transform: uppercase;
      padding: 6px 10px; cursor: pointer; flex-shrink: 0; transition: background 120ms;
    }
    .fast-banner__end:hover { background: rgba(220,38,38,.15); }

    /* ── CONFIRM RECORD ROW ───────────────────────────────────────── */
    .confirm-row {
      display: grid; grid-template-columns: 100px 1fr;
      border-bottom: var(--rule-solid); padding: var(--s-6) var(--s-9);
    }
    .confirm-row:last-child { border-bottom: none; }
    .confirm-row__key { font: 400 11px/1.3 var(--font-mono); color: var(--ink-dim); }
    .confirm-row__val { font: 400 16px/1.35 var(--font-serif); color: var(--ink); word-break: break-word; }

    /* ── TAB STRIP ────────────────────────────────────────────────── */

    }
    .hr-stop-handle {
      position: absolute; right: 4px; top: 4px; bottom: 4px; width: 68px;
      background: var(--state-err); color: #fff;
      display: grid; place-items: center;
      font: 700 13px/1 var(--font-sans);
      cursor: grab; touch-action: none;
      user-select: none; -webkit-user-select: none;

    .hr-stop-handle:active { cursor: grabbing; }
    .hr-confirm-overlay {
      position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);

    /* ── REDUCED MOTION ───────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {

    /* ── DOSE QTY INPUT ─────────────────────────────────────────────── */

    .review-entry__label { font: 400 16px/1.35 var(--font-serif); color: var(--ink); }
    .review-entry__time { font: 400 11px/1 var(--font-mono); color: var(--ink-dim); }
    .review-entry__detail {
      display: none; padding: 0 var(--s-9) var(--s-7);
      font: 400 11px/1.6 var(--font-mono); color: var(--ink-dim);
      border-top: var(--rule-dashed);
    }
    .review-entry__detail.open { display: block; }
    .review-entry__detail-row { display: grid; grid-template-columns: 100px 1fr; padding: 3px 0; }
    .review-entry__detail-key { color: var(--ink-muted); }
    .review-entry__detail-val { color: var(--ink); word-break: break-word; }

    /* ── LIFT (W3b; built from W3b_Mock/index.html, its classes copied) ── */
    .ask { background: var(--accent-tint); border-left: 3px solid var(--accent); padding: var(--s-6) var(--s-9); font: 400 12px/1.5 var(--font-sans); color: var(--ink); }
    .ask b { font-weight: 600; }
    .link-btn { background: none; border: none; font: 400 11px/1 var(--font-mono); color: var(--accent); cursor: pointer; padding: 10px 4px; }
    .btn-light {
      padding: 10px 12px; background: #fff; color: var(--accent); border: 1px solid var(--paper-line); border-radius: var(--r-1);
      font: 600 10.5px/1 var(--font-sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
    }
    .btn-light:active { background: var(--paper-edge); }
    .btn-light:disabled { color: var(--ink-muted); cursor: not-allowed; }
    .hr-strip {
      position: sticky; top: 0; z-index: 25; background: var(--navy-dark); border-bottom: 1px solid var(--accent);
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: var(--s-7); padding: var(--s-6) var(--s-9);
      padding-top: max(env(safe-area-inset-top, 0px), var(--s-6));
    }
    .hr-strip__bpm { font: 400 34px/1 var(--font-mono); letter-spacing: .04em; min-width: 66px; background: none; border: none; text-align: left; padding: 0; cursor: pointer; }
    .hr-strip__mid { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .hr-strip__name { font: 600 13px/1.2 var(--font-serif); color: var(--on-navy-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hr-strip__sub { font: 400 10.5px/1.2 var(--font-mono); color: var(--on-navy-fg-dim); }
    .hr-strip__timer { font: 400 17px/1 var(--font-mono); color: var(--on-navy-fg); text-align: right; }
    .hr-strip__store { font: 400 9.5px/1.2 var(--font-mono); color: var(--on-navy-fg-dim); text-align: right; margin-top: 4px; }
    .hr-strip__row { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s-5); flex-wrap: wrap; }
    .ex-tag { font: 400 9.5px/1 var(--font-mono); letter-spacing: .12em; color: var(--ink-dim); border: 1px solid var(--paper-line); padding: 2px 5px; background: #fff; white-space: nowrap; }
    .ex-tag--uni { color: var(--accent); border-color: rgba(42,100,150,.35); }
    .set-row {
      display: grid; grid-template-columns: 46px 62px 14px 70px 1fr 44px; align-items: center; column-gap: var(--s-3);
      padding: var(--s-4) var(--s-9); background: #fff; border-bottom: var(--rule-solid); min-height: 54px;
    }
    .set-row__no { font: 400 11px/1 var(--font-mono); color: var(--ink-dim); }
    .set-from { display: block; margin-top: 3px; font: 400 9px/1.2 var(--font-mono); letter-spacing: .04em; color: var(--state-warn); }

    .set-unit { font: 400 10px/1.2 var(--font-mono); color: var(--ink-dim); padding-left: 4px; }
    .set-note { display: block; font: 400 9px/1.2 var(--font-mono); letter-spacing: .1em; color: var(--state-warn); padding-left: 4px; margin-top: 2px; }
    .set-check {
      width: 40px; height: 40px; justify-self: end; display: inline-grid; place-items: center; border: 1.5px solid var(--paper-line); background: #fff;
      cursor: pointer; font: 700 18px/1 var(--font-sans); color: transparent;
    }
    .set-row--sugg { background: var(--paper-2); }
    .set-row--sugg .set-in { color: var(--ink-muted); font-style: italic; }
    .set-row--done .set-check { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ex-foot { display: flex; gap: var(--s-5); padding: var(--s-6) var(--s-9); background: var(--paper); }
    .ex-foot__vol { margin-left: auto; align-self: center; font: 400 10.5px/1.2 var(--font-mono); color: var(--ink-dim); text-align: right; }
    .tl-row {
      display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: var(--s-5); padding: var(--s-5) var(--s-9);
      background: #fff; border-bottom: var(--rule-solid);
    }
    .tl-row__name { font: 400 16px/1.35 var(--font-serif); color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tl-row__btns { display: flex; gap: 2px; }
    .ico { width: 36px; height: 36px; border: 1px solid var(--paper-line); background: var(--paper-2); color: var(--ink-dim); font: 400 14px/1 var(--font-mono); cursor: pointer; }
    .ico:disabled { opacity: .35; cursor: default; }
    .kt-wrap { overflow-x: auto; background: #fff; }
    table.kt { border-collapse: collapse; width: 100%; font: 400 11px/1.3 var(--font-mono); color: var(--ink); }
    table.kt th { text-align: left; font: 600 9px/1.2 var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); padding: 6px 8px; border-bottom: var(--rule-solid); background: var(--paper-2); white-space: nowrap; }
    table.kt td { padding: 6px 8px; border-bottom: var(--rule-solid); white-space: nowrap; }
    table.kt td.num { text-align: right; }
    table.kt tr.skip td { color: var(--ink-muted); }
    .overlay { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(10,22,35,.9); z-index: 50; display: flex; align-items: center; justify-content: center; padding: var(--s-11); }
    .overlay__box { width: 100%; max-width: 430px; background: var(--navy-mid); border: 1px solid var(--accent); padding: var(--s-11); }
    .overlay__title { font: 500 20px/1.2 var(--font-serif); color: var(--on-navy-fg); text-align: center; margin-bottom: var(--s-8); }
    .overlay__text { font: 400 12px/1.6 var(--font-mono); color: var(--on-navy-fg-dim); margin-bottom: var(--s-10); }
    .overlay__text b { color: var(--state-warn); font-weight: 500; }

<body>
<div class="app-shell">
  <div class="scroll" id="scroll">
    <div id="app"></div>
  </div>
  <div class="sign-and-file" id="saf" style="display:none"></div>
</div>
<div id="lift-overlay"></div>

<script src="hr-core.js"></script>
<script src="lift-core.js"></script>
<script src="pb-client.js"></script>
<script>
// ── CONFIG ─────────────────────────────────────────────────────────────────
const PB_URL = 'https://journal-api.fybertech.cloud';

// ── POCKETBASE CLIENT (pb-client.js; W2: native auth on journal_entries) ────
// Every request goes through PBClient -- this script issues no fetch of its own.
// No usable token => no request: the sign-in screen, never an empty-looking app.
const PB = PBClient.create({ url: PB_URL, fetch: function(u, o) { return fetch(u, o); },
                             storage: localStorage, onAuthLost: pbAuthLost });

// W2: a lost session routes to the sign-in screen -- except during a capture, which is
// never interrupted (its store ticks count as missed; the local checkpoint carries on).
function pbAuthLost() {
  if (hrSessionActive) return;
  if (liftRunning) return;              // W3b: nor is a running Lift session (its writes count as missed; the local copy carries on)
  if (location.hash !== '#signin') location.hash = '#signin';
}

// PocketBase date-filter values need a space, not 'T', separating date/time.
function pbDate(iso) { return iso.replace('T', ' '); }

// ── SUPPLEMENTS ────────────────────────────────────────────────────────────
const SUPS = [
  { name:'Tirzepatide',           dose:'2.0mg',     class:'GLP-1/GIP',  route:'inj', hold:false },
  { name:'Repatha',               dose:'23.5mg',    class:'PCSK9 mAb',  route:'inj', hold:false },
  { name:'Vitamin D3',            dose:'10,000 IU', class:'vitamin',    route:'po',  hold:false },
  { name:'Nicotinamide Riboside', dose:'1g',        class:'NAD+ prec.', route:'po',  hold:false },
  { name:'Magnesium Glycinate',   dose:'360mg',     class:'mineral',    route:'po',  hold:false },
  { name:'Omega-3',               dose:'4g',        class:'EPA/DHA',    route:'po',  hold:false },
  { name:'Creatine Monohydrate',  dose:'20g',       class:'ergogenic',  route:'po',  hold:false },
  { name:'Glycine',               dose:'3g',        class:'amino',      route:'po',  hold:false },
  { name:'GHK-Cu',                dose:'2.0mg',     class:'peptide',    route:'sc',  hold:false },
];

// ── ENTRY META ─────────────────────────────────────────────────────────────
const EMETA = {
  resistance: { code:'LI', label:'Lift',             sub:'resistance session · sets R × W' },   // W3b (D-57); first, as the mock
  heart_rate: { code:'HE', label:'Heart Rate',       sub:'cardio · BLE monitor'  },
  fast:       { code:'FA', label:'Fast',             sub:'fasting window log'    },
  supplement: { code:'SU', label:'Supplements',      sub:'daily stack admin.'    },
  red_light:  { code:'RL', label:'Red Light',        sub:'photobiomodulation'    },
  sauna:      { code:'SA', label:'Sauna',            sub:'thermal recovery'      },
  alcohol:    { code:'AL', label:'Alcohol',          sub:'consumption event'     },
  massage:    { code:'MA', label:'Massage',          sub:'soft tissue recovery'  },
  flight:     { code:'FL', label:'Overnight Flight', sub:'sleep disruption log'  },
  timezone:   { code:'TZ', label:'Timezone Change',  sub:'circadian context'     },
  note:       { code:'NT', label:'Note',             sub:'free-text observation' },
};

// ── HEART RATE ZONES (Nov 2025 VO2 Max test: VT1 129 / VT2 158 / HRmax 175) ─
// Do not change without ingesting new VO2 Max test results (next: Sep 2026).
const HR_ZONES = [
  { key: 'sub1', label: 'Sub-1 · Rest',      min: 0,   max: 99,  color: '#94a3b8' },
  { key: 'z1',   label: 'Z1 · Recovery',     min: 100, max: 116, color: '#22c55e' },
  { key: 'z2',   label: 'Z2 · Fat Burn',     min: 117, max: 129, color: '#84cc16' },
  { key: 'z3',   label: 'Z3 · Aerobic',      min: 130, max: 150, color: '#f59e0b' },
  { key: 'z4',   label: 'Z4 · Threshold',    min: 151, max: 158, color: '#f97316' },
  { key: 'z5',   label: 'Z5 · VO2 Max',      min: 159, max: 999, color: '#dc2626' },
];

// ── HR CAPTURE CONSTANTS (JA build 2026-07-12) ─────────────────────────────
const HR_GAP_CAP_SEC  = 360;  // max BLE gap (s) to interpolate — JB decision 2026-07-12; longer gaps recorded as signal-lost, never fabricated
const HR_HOLE_MIN_SEC = 15;   // timeline hole (s) at or below this is sampling jitter, not signal loss
const HR_CKPT_KEY = 'hr_session';   // localStorage checkpoint key (A1)



// ── STATE ──────────────────────────────────────────────────────────────────
let db           = null;
let fastTick     = null;
let safClockTick = null;
let currentSubmit = null;
let currentType   = null;
let confirmEntry  = null;

// ── HEART RATE STATE ────────────────────────────────────────────────────────
let hrDevice        = null;   // BLE BluetoothDevice reference
let hrChar          = null;   // BLE characteristic reference
let hrBuffer        = [];     // Rolling 5-reading buffer for smoothed display
let hrSamples       = [];     // {t: wallClockSec, bpm[, est]} — 1 pt / 5 s (A3)
let hrRRBuffer      = [];     // Raw RR intervals (ms) for RMSSD — live packets only
let hrStartTime     = null;   // Date.now() at Start Exercise (wall-clock anchor)
let hrEndTime       = null;   // Date.now() at confirmed stop
let hrSessionActive = false;  // true from Start until confirmed stop — locks navigation (A4)
let hrExerciseType  = null;   // locked at Start (A2)
let hrSessionData   = null;   // computed results, populated by hrComputeSessionData()
let hrTimerTick     = null;   // 1 s ticker (locked capture view)
let hrLastPacketAt  = null;   // Date.now() of last BLE packet (staleness display)
let hrLastBpm       = null;   // last displayed 5-s avg (checkpoint / display continuity)
let hrWakeLock      = null;   // Screen Wake Lock sentinel (keeps display on during session)
let hrCheckpointTick = null;  // 5 s localStorage checkpoint interval (A1)
let hrReconnectTimer = null;  // BLE auto-reconnect retry timer (A1)
// JA2: the session lives in the store from START (JA2_Build_Brief_v1.md §2.1)
let hrSessionId     = null;   // uuid minted at START; ties the local checkpoint to the store record
let hrStore         = null;   // HRCore.createStoreSession(PB) — pbId / lastOk / missed live in hrStore.state
let hrStoreTickTimer = null;  // 5 s scheduler; HRCore.tickDue decides (STORE_TICK_SEC = 60, Q1)
let hrLaunch        = null;   // HRCore.resumeDecision result from the launch query
let hrReconnectAttempts = 0;  // A1.3 (JA2 §2.3): bounded by HRCore.RECONNECT_MAX, shown on the button
let rvShowDiscarded = false;  // Log Review: discarded sessions hidden behind a toggle (JA2 §2.4)
const HR_OTHER_KEY   = 'hr_session_other';      // a second unfiled local session found at launch
const HR_DISCARD_KEY = 'hr_session_discarded';  // soft-discard slot (Q7: 7 days)
let hrLiftSessionId = null;   // W3b (Q3 (c), L15): the Lift session_id a strap session started from Lift carries

// ── LIFT STATE (W3b; the rules live in lift-core.js, this script only wires them) ──
const LIFT_KEY          = 'lift_session';            // the active Lift session's local copy (brief §1.3), LiftCore's shape
const LIFT_DISCARD_KEY  = 'lift_session_discarded';  // soft-discard slot, the HR pattern
const LIFT_TPL_CACHE    = 'lift_templates_cache';    // the picker's last good store read, so no signal at the gym still lists templates (Q5)
let liftRunning   = false;   // a Lift session runs in THIS window: the route lock (L19) holds
let liftSession   = null;    // the running session, LiftCore's local-copy shape { v, session_id, started_at, ended_at?, pb_id, missed, meta }
let liftStore     = null;    // LiftCore.createLiftStoreSession(PB)
let liftTickTimer = null;    // 1 s: the strip, the HR link, a due store write (L18)
let liftRetryTimer = null;   // a finished Lift session the store refused is retried while the app is open (L20)
let liftTemplates = null;    // lift_template records (store, else the cache)
let liftHistory   = [];      // filed resistance records (pre-fill, L5; "last …" in the picker)
let liftHistoryOk = false;   // the history read succeeded (else pre-fill is absent: "no signal")
let liftTodayHr   = null;    // today's heart_rate records, for LINK (L15)
let liftPick      = { tplId: null, hrMode: 'strap', hrLink: null };   // the mock's defaults (D-60)
let liftEditTpl   = null;    // the template editor's draft
let liftNewLat    = 'both';  // BILATERAL / UNILATERAL chips
let liftLastFiled = null;    // the outcome of the last FINISH (confirm screen + undo, §3 Q2)
let liftFiling    = false;   // FINISH in flight: a second tap does nothing

// ── INIT ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (PB_URL && !PB_URL.includes('YOUR_')) {
    db = true;
  }
  window.addEventListener('hashchange', render);
  PB.refresh();         // W2: extend the token on every launch; a refusal routes to sign-in, offline keeps it
  hrStore = HRCore.createStoreSession(PB);
  liftStore = LiftCore.createLiftStoreSession(PB, { now: function() { return Date.now(); } });
  hrLaunchRecovery();   // JA2: ask the store for an open session (async; re-renders home if it finds one)
  liftLaunchRecovery(); // W3b: the same for a Lift session (the store first, then the phone)
  // A1: an unfinished/unlogged HR session checkpoint takes precedence —
  // land on #home so the Resume banner is visible after any reload.
  if (hrGetCheckpoint() || liftGetLocal()) {
    if (location.hash === '#home') render();
    else location.hash = '#home';
    return;
  }
  if (!location.hash || location.hash === '#') location.hash = '#home';
  else render();
});

// ── ROUTER ─────────────────────────────────────────────────────────────────
function navigate(hash) {
  // an unchanged hash fires no hashchange: render directly, or the screen goes stale (s20: END FAST on home ended
  // the fast but left the banner up until a reload). Four callers had worked around this by hand; this is the one site.
  if (location.hash === hash) render(); else location.hash = hash;
}

function render() {
  const hash = location.hash || '#home';
  // L19 (W3b): a running Lift session locks the app to the Lift screen; with the strap linked the HR
  // view is admitted too, and only it. Before the HR lock (A4), which would otherwise pull a strap
  // Lift session onto the HR capture view, and before the sign-in gate (never interrupted by it).
  if (liftRunning) {
    const to = LiftCore.lockRoute(hash, { lift: true, strap: liftStrapLinked() });
    if (to) { location.hash = to; return; }
    liftRenderLocked(hash);
    return;
  }
  // A4: an active capture session locks the app to the capture view —
  // back button / hash edits / stray navigation cannot kill a recording.
  if (hrSessionActive) {
    if (hash !== '#log/heart_rate') { location.hash = '#log/heart_rate'; return; }
    if (!document.getElementById('hr-locked')) hrRenderLockedView();
    return;
  }
  // No active session: tear down BLE + timers when navigating.
  // NOTE: do NOT clear hrSamples/hrBuffer/hrRRBuffer/hrSessionData here —
  // submitHeartRate() clears them after a successful write.
  // W3b (D-60 (2)): a strap connected on the Lift screen stays connected across the Lift pick screen
  // and the template editor; every other route releases it, as before.
  if (!liftKeepsStrap(hash)) {
    if (hrChar)   { hrChar.stopNotifications().catch(function(){}); hrChar = null; }
    if (hrDevice) { try { hrDevice.gatt.disconnect(); } catch(e){} hrDevice = null; }
  }
  clearInterval(hrTimerTick);
  clearInterval(hrCheckpointTick);
  clearTimeout(hrReconnectTimer);
  hrReleaseWakeLock();
  const scroll = document.getElementById('scroll');
  hideSaf();

  // W2: signed out -> the sign-in screen, for every route (after the capture lock above:
  // a recording is never interrupted by the gate). Local drafts are untouched either way.
  if (!PB.signedIn()) {
    if (hash !== '#signin') { location.hash = '#signin'; return; }
    scroll.classList.remove('scroll--nofooter');
    renderSignIn();
    document.getElementById('scroll').scrollTop = 0;
    return;
  }
  if (hash === '#signin') { location.hash = '#home'; return; }

  if (hash === '#home' || hash === '#') {
    scroll.classList.add('scroll--nofooter');
    renderHome();
  } else if (hash === '#confirm') {
    scroll.classList.add('scroll--nofooter');
    renderConfirm();
  } else if (hash.startsWith('#log/')) {
    scroll.classList.remove('scroll--nofooter');
    renderForm(hash.replace('#log/', ''));
  } else if (hash === '#review') {
    scroll.classList.remove('scroll--nofooter');
    renderLogReview();
  } else if (hash.startsWith('#lift/tpl/')) {
    scroll.classList.remove('scroll--nofooter');
    liftRenderTemplate(decodeURIComponent(hash.slice('#lift/tpl/'.length)));
  } else {
    scroll.classList.add('scroll--nofooter');
    renderHome();
  }
  document.getElementById('scroll').scrollTop = 0;
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; });
}

function startFastBannerTimer(fast) {
  clearInterval(fastTick);
  function update() {
    const el = document.getElementById('banner-timer');
    if (!el) { clearInterval(fastTick); return; }
    const ms  = Date.now() - new Date(fast.startedAt).getTime();
    const pct = Math.min(Math.round((ms / (fast.window_hours * 3600000)) * 100), 100);
    el.textContent = fmtDur(ms) + ' · ' + pct + '%';
  }
  update();
  fastTick = setInterval(update, 1000);
}

      entry_type: 'fast', started_at: startedAt, ended_at: null, notes: note,
      metadata: { fast_type: 'manual' },

    saveActiveFast({ type: 'manual', startedAt: startedAt, id: result.data.id, window_hours: 18 });
    confirmEntry = result.data; navigate('#confirm');
  }
}

  var m = String(doseStr).match(/^([\d.,]+)\s*(.*)$/);

  return { qty: doseStr, unit: '' };
}

function saveAndAddSup() {
  var name  = (document.getElementById('new-sup-name')  || {}).value || '';
  var qty   = (document.getElementById('new-sup-qty')   || {}).value || '';
  var unit  = (document.getElementById('new-sup-unit')  || {}).value || '';
  var cls   = (document.getElementById('new-sup-class') || {}).value || '';
  var route = (document.getElementById('new-sup-route') || {}).value || 'po';
  if (!name.trim()) { alert('Name is required'); return; }
  saveCustomSup({ name: name.trim(), dose: qty.trim() + unit.trim(), class: cls.trim() || 'custom', route: route, hold: false });
  buildSupplementForm(EMETA.supplement);
  showSaf('LOG IT');
}

function toggleSup(i) {
  var chk     = document.getElementById('sup-chk-' + i);
  var row     = document.getElementById('sup-row-' + i);
  var checked = chk.getAttribute('aria-checked') === 'true';
  chk.setAttribute('aria-checked', String(!checked));
  chk.textContent = !checked ? '\u2713' : '';
  row.classList.toggle('supplement-row--checked', !checked);
  var count = document.querySelectorAll('.supplement-check[aria-checked="true"]').length;
  var el    = document.getElementById('sup-count');
  if (el) el.textContent = count;
}

function selectTab(el, groupId) {
  document.querySelectorAll('#' + groupId + ' .tab-chip').forEach(function(t) { t.setAttribute('aria-selected', 'false'); });
  el.setAttribute('aria-selected', 'true');
  var wrap = document.getElementById('custom-time-wrap');
  if (wrap) wrap.style.display = el.dataset.time === 'Custom' ? '' : 'none';
}

async function submitSupplement() {
  var allSups = SUPS.concat(getCustomSups());
  var taken = [], skipped = [];
  allSups.forEach(function(s, i) {
    var chk = document.getElementById('sup-chk-' + i);
    if (chk && chk.getAttribute('aria-checked') === 'true') {
      var doseQtyEl = document.getElementById('dose-qty-' + i);
      var pd = parseDose(s.dose);
      var qty = doseQtyEl ? doseQtyEl.value.trim() : pd.qty;
      var finalDose = qty + (pd.unit ? pd.unit : '');
      taken.push({ supplement_id: i + 1, name: s.name, dose: finalDose });
    } else {
      skipped.push({ supplement_id: i + 1, name: s.name, reason: s.hold ? 'hold' : 'not taken' });
    }
  });
  if (!taken.length) { showErr('Select at least one supplement'); return; }
  var activeTabEl = document.querySelector('#time-tabs [aria-selected="true"]');
  var activeTab   = activeTabEl ? activeTabEl.dataset.time : 'Now';
  var takenAt = new Date().toISOString();
  if (activeTab !== 'Now' && activeTab !== 'Custom') {
    var parts = activeTab.split(':').map(Number);
    var d = new Date(); d.setHours(parts[0], parts[1], 0, 0); takenAt = d.toISOString();
  } else if (activeTab === 'Custom') {
    var cv = document.getElementById('f-sup-custom');
    if (cv && cv.value) takenAt = new Date(cv.value).toISOString();
  }
  var noteEl = document.getElementById('f-sup-note');
  var note   = noteEl ? noteEl.value.trim() || null : null;
  saveDoses(taken.map(function(t) { return { name: t.name, dose: t.dose }; }));
  var metadata = {
    taken:      taken.map(function(t) { return { name: t.name, dose: t.dose }; }),
    taken_full: taken, skipped: skipped,
    preset_time: activeTab.toLowerCase(), count: taken.length, of: allSups.length,
  };
  await writeEntry('supplement', takenAt, takenAt, note, metadata);
}

var TZ_OFFSETS = {
  'UTC':0,'GMT':0,'EST':-5,'EDT':-4,'CST':-6,'CDT':-5,'MST':-7,'MDT':-6,
  'PST':-8,'PDT':-7,'AKST':-9,'AKDT':-8,'HST':-10,'AST':-4,'NST':-3.5,
  'BRT':-3,'ART':-3,'CLT':-3,'BOT':-4,'PYT':-4,'VET':-4,'COT':-5,'PET':-5,'ECT':-5,
  'WET':0,'CET':1,'CEST':2,'EET':2,'EEST':3,'MSK':3,'TRT':3,
  'IST':5.5,'PKT':5,'BST_BD':6,'ICT':7,'WIB':7,'CST_CN':8,'SGT':8,'HKT':8,
  'JST':9,'KST':9,'AEST':10,'AEDT':11,'NZST':12,'NZDT':13,
  'CAT':2,'EAT':3,'WAT':1,'SAST':2,
};

function calcTzOffset() {
  var fromEl = document.getElementById('f-tz-from');
  var toEl   = document.getElementById('f-tz-to');
  var offEl  = document.getElementById('f-tz-offset');
  if (!fromEl || !toEl || !offEl) return;
  var fromKey = fromEl.value.trim().toUpperCase();
  var toKey   = toEl.value.trim().toUpperCase();
  if (TZ_OFFSETS[fromKey] !== undefined && TZ_OFFSETS[toKey] !== undefined) {
    var diff = TZ_OFFSETS[toKey] - TZ_OFFSETS[fromKey];
    offEl.value = (diff >= 0 ? '+' : '') + diff;
    offEl.style.color = 'var(--accent-bright)';
  }
}

// ── HEART RATE MODULE (JA build 2026-07-12) ────────────────────────────────
// A1 checkpoint/resume + auto-reconnect · A2 locked type · A3 wall-clock timer
// + capped interpolation (CAP=HR_GAP_CAP_SEC) · A4 locked capture view ·
// A5 swipe-to-stop + confirm. Supersedes the v6 pause/watchdog model
// (paused_sec) — old entries still render in Log Review.

// ── CHECKPOINT (A1; v2 since JA2) ───────────────────────────────────────────
function hrSaveCheckpoint() {
  if (!hrStartTime) return;
  try {
    var cp = { v: 2, started_at: hrStartTime, exercise_type: hrExerciseType,
               samples: hrSamples, rr: hrRRBuffer, last_bpm: hrLastBpm,
               session_id: hrSessionId, pb_id: hrStore ? hrStore.state.pbId : null,
               missed_ticks: hrStore ? hrStore.state.missed : 0 };
    if (hrEndTime) cp.ended_at = hrEndTime;
    if (hrLiftSessionId) cp.lift_session_id = hrLiftSessionId;   // W3b: LiftCore.pairDecision reads it at launch
    localStorage.setItem(HR_CKPT_KEY, JSON.stringify(cp));
  } catch (e) { /* storage full — checkpoint is best-effort; the store tick is the other copy */ }
}
function hrGetCheckpoint() {
  try {
    var cp = JSON.parse(localStorage.getItem(HR_CKPT_KEY));
    return (cp && (cp.v === 1 || cp.v === 2) && cp.started_at) ? cp : null;   // v1 = a pre-JA2 checkpoint, still honoured
  } catch (e) { return null; }
}
function hrClearCheckpoint() { localStorage.removeItem(HR_CKPT_KEY); }
function hrGetSlot(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
function hrFmtStart(ms) { return new Date(ms).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false }); }

function hrResetState() {
  hrSessionData = null; hrStartTime = null; hrEndTime = null;
  hrSessionActive = false; hrExerciseType = null;
  hrLastPacketAt = null; hrLastBpm = null;
  hrSamples = []; hrRRBuffer = []; hrBuffer = [];
  hrSessionId = null; hrLiftSessionId = null; if (hrStore) hrStore.adopt(null, 0);
  clearInterval(hrTimerTick); clearInterval(hrCheckpointTick); clearInterval(hrStoreTickTimer);
  clearTimeout(hrReconnectTimer);
  if (hrChar)   { hrChar.stopNotifications().catch(function(){}); hrChar = null; }
  if (hrDevice) { try { hrDevice.gatt.disconnect(); } catch(e){} hrDevice = null; }
  hrReleaseWakeLock();
}

// ── THE STORE-SIDE SESSION (JA2 §2.1) ───────────────────────────────────────
// The session exists in PocketBase from START; every tick read-merge-writes the
// samples (HRCore.createStoreSession); stop / file / discard are states. Nothing deletes.
function hrDeviceLabel() { try { return localStorage.getItem('hr_device') || 'phone'; } catch (e) { return 'phone'; } }
function hrMintSessionId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) { var r = Math.random()*16|0; return (c === 'x' ? r : (r&0x3|0x8)).toString(16); });
}
function hrSnapshot() {   // what the store engine writes; the state is set by the engine
  var stopped = !hrSessionActive && hrSessionData;
  return { session_id: hrSessionId, device: hrDeviceLabel(), exercise_type: hrExerciseType,
           samples: stopped ? hrSessionData.samples : hrSamples, rr: hrRRBuffer,
           summary: stopped ? hrSessionData : null, started_ms: hrStartTime, ended_ms: hrEndTime,
           lift_session_id: hrLiftSessionId };   // W3b (L15): null on every HR session not started from Lift, and then absent from the store
}
function hrAdoptMerged(samples, rr) { hrSamples = samples; hrRRBuffer = rr; }
async function hrStoreWrite(state, note) {
  if (!db || !hrStore) return false;
  var ok = await hrStore.write(state, hrSnapshot, note, state === 'active' ? hrAdoptMerged : null);
  hrSaveCheckpoint();   // the checkpoint carries pb_id / missed_ticks either way
  return ok;
}
function hrStoreTickMaybe() {
  if (!hrSessionActive || !hrStore) return;
  if (hrStore.due()) hrStoreWrite('active');
}
function hrStartStoreTicks() {
  clearInterval(hrStoreTickTimer);
  hrStoreTickTimer = setInterval(hrStoreTickMaybe, 5000);
  hrStoreTickMaybe();
}
// The stop / file writes retry (the ticks are gone once the session stops).
async function hrStoreWriteRetry(state, note, tries) {
  for (var i = 0; i < (tries || 3); i++) {
    if (await hrStoreWrite(state, note)) return true;
    await new Promise(function(r) { setTimeout(r, 2000 * (i + 1)); });
  }
  return false;
}
function hrStoreStatusText() { return (!db || !hrStore) ? 'STORE: OFF' : hrStore.statusText(); }

// Launch: ask the store for an open session BEFORE trusting the phone (brief §2.1 table).
async function hrLaunchRecovery() {
  var dsc = hrGetSlot(HR_DISCARD_KEY);   // Q7: the local discard slot expires
  if (dsc && dsc.discarded_at && Date.now() - dsc.discarded_at > HRCore.DISCARD_KEEP_DAYS * 86400000) {
    try { localStorage.removeItem(HR_DISCARD_KEY); } catch (e) {}
  }
  var storeRec = null, storeError = false;
  if (db) {
    var r = await PB.list({ sort: '-started_at', perPage: 5,
      filter: 'entry_type = "heart_rate" && ended_at = "" && metadata.state = "active"' });
    if (r.error || !r.data) storeError = true;
    else storeRec = r.data.filter(HRCore.isOpenEntry)[0] || null;
  } else storeError = true;
  var local = hrGetCheckpoint();
  hrLaunch = HRCore.resumeDecision({ store: storeRec, local: local, nowMs: Date.now(), storeError: storeError });
  var d = hrLaunch;
  if (d.other_local && (d.other_local.samples || []).length) {   // a different unfiled local session: kept, offered separately
    try { localStorage.setItem(HR_OTHER_KEY, JSON.stringify(d.other_local)); } catch (e) {}
  }
  if (d.action === 'stale') {                                     // Q6: stopped at its last checkpoint, never resumed
    if (d.local) {
      var cp = d.local, lastT = (cp.samples || []).length ? cp.samples[cp.samples.length - 1].t : 0;
      cp.ended_at = cp.started_at + (lastT + 5) * 1000; cp.pb_id = cp.pb_id || d.record.id;
      try { localStorage.setItem(HR_CKPT_KEY, JSON.stringify(cp)); } catch (e) {}
    } else hrSaveCheckpointFromStore(d.record, true);
  } else if (d.action === 'resume' && d.source === 'store') hrSaveCheckpointFromStore(d.record, false);
  if (hrSessionActive) return;                                    // a capture is already running in this window
  if (hrGetCheckpoint() || hrGetSlot(HR_OTHER_KEY)) {
    if (location.hash === '#home') render(); else location.hash = '#home';
  }
}
function hrSaveCheckpointFromStore(rec, stale) {
  var m = rec.metadata || {};
  var cp = { v: 2, started_at: Date.parse(rec.started_at.replace(' ', 'T')), exercise_type: m.exercise_type || 'Cardio',
             samples: (m.samples || []).filter(function(s) { return !s.est; }),   // J3: never re-read a synthetic point as real
             rr: (m.rr || []).slice(), last_bpm: null,
             session_id: m.session_id || null, pb_id: rec.id, missed_ticks: 0 };
  if (m.lift_session_id) cp.lift_session_id = m.lift_session_id;   // W3b: the Lift session it belongs to survives a store-side resume
  if (rec.ended_at) {                                             // a stopped record keeps its own end
    var endMs = Date.parse(String(rec.ended_at).replace(' ', 'T'));
    cp.ended_at = isNaN(endMs) ? cp.started_at + 1000 : endMs;
  } else if (stale) {                                             // the tail after the last checkpoint is a gap (J3)
    var lastMs = Date.parse((m.checkpoint_at || rec.started_at).replace(' ', 'T'));
    cp.ended_at = isNaN(lastMs) ? cp.started_at + 1000 : lastMs;
  }
  try { localStorage.setItem(HR_CKPT_KEY, JSON.stringify(cp)); } catch (e) {}
}

// Home-screen banner for an interrupted (reload) or unlogged (stopped, not
// filed) session. Resume rebuilds state and continues; Discard is two-tap.
function hrResumeBannerHTML() {
  var html = '';
  var cp = hrGetCheckpoint();
  if (cp && !liftPairsHr()) html += hrBannerFor(cp, 'primary');   // W3b: an HR session its Lift session names rides the Lift banner (one RESUME)
  var other = hrGetSlot(HR_OTHER_KEY);
  if (other) html += hrBannerFor(other, 'other');
  return html;
}
function hrBannerFor(cp, slot) {
  var started = new Date(cp.started_at).toLocaleString('en-US',
    { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
  var ended = !!cp.ended_at;
  var sum = HRCore.summarize(cp.samples || []);
  var where = cp.pb_id ? 'in store' : 'phone only';
  return '<div class="fast-banner" id="hr-resume-banner-' + slot + '" style="border-left:3px solid var(--state-warn)">' +
    '<span class="fast-banner__code">HE</span>' +
    '<div class="fast-banner__body">' +
      '<div class="fast-banner__type">' + (ended ? 'UNLOGGED' : 'INTERRUPTED') + ' HR SESSION &middot; ' + (cp.exercise_type || '&mdash;') + '</div>' +
      '<div class="fast-banner__timer">started ' + started + ' &middot; ' + sum.count + ' samples &middot; ' + where + '</div>' +
    '</div>' +
    (slot === 'primary'
      ? '<button class="fast-banner__end" style="border-color:rgba(34,197,94,.5);color:#86efac" onclick="hrResumeSession()">' + (ended ? 'REVIEW' : 'RESUME') + '</button>'
      : '<button class="fast-banner__end" style="border-color:rgba(34,197,94,.5);color:#86efac" onclick="hrPromoteOther()">REVIEW</button>') +
    '<button class="fast-banner__end" onclick="hrDiscardArm(this,\'' + slot + '\')">DISCARD</button>' +
  '</div>';
}
function hrPromoteOther() {   // the second unfiled session becomes the checkpoint once the primary is gone
  if (hrGetCheckpoint()) { showErr('Finish or discard the current session first'); autoHideErr(4000); return; }
  var other = hrGetSlot(HR_OTHER_KEY);
  if (!other) return;
  if (!other.ended_at) {      // interrupted with no store copy: it stopped at its last sample (J3: the tail is not invented)
    var lastT = (other.samples || []).length ? other.samples[other.samples.length - 1].t : 0;
    other.ended_at = other.started_at + (lastT + 5) * 1000;
  }
  try { localStorage.setItem(HR_CKPT_KEY, JSON.stringify(other)); localStorage.removeItem(HR_OTHER_KEY); } catch (e) {}
  hrResumeSession();
}

function hrDiscardArm(btn, slot) {   // two-tap destructive guard — the second tap names what is discarded (JA2 §2.2)
  slot = slot || 'primary';
  if (btn.dataset.armed === '1') { hrDiscardSession(slot); return; }
  btn.dataset.armed = '1';
  var orig = btn.textContent;
  var cp = slot === 'other' ? hrGetSlot(HR_OTHER_KEY) : hrGetCheckpoint();
  var elapsed = cp ? Math.floor(((cp.ended_at || Date.now()) - cp.started_at) / 1000) : 0;
  btn.textContent = cp ? HRCore.discardLabel(cp.samples || [], elapsed) : 'SURE?';
  setTimeout(function() {
    if (btn && btn.isConnected) { btn.dataset.armed = ''; btn.textContent = orig; }
  }, 4000);
}

// Soft discard (JA2 §2.2): the session moves to the discard slot locally and to
// state "discarded" in the store. Nothing is deleted; Log Review can restore it.
function hrDiscardSession(slot) {
  slot = slot || 'primary';
  var key = slot === 'other' ? HR_OTHER_KEY : HR_CKPT_KEY;
  var cp = hrGetSlot(key);
  if (cp) {
    cp.discarded_at = Date.now();
    try { localStorage.setItem(HR_DISCARD_KEY, JSON.stringify(cp)); } catch (e) {}
    if (db && cp.pb_id) hrStoreDiscard(cp);
  }
  try { localStorage.removeItem(key); } catch (e) {}
  if (slot === 'primary') hrResetState();
  if (location.hash === '#home') render(); else navigate('#home');
}
async function hrStoreDiscard(cp) {
  // W2 (C-8): a refusal is shown, never swallowed -- the local discard slot keeps the session either way
  var cur = await PB.get(cp.pb_id);
  if (cur.error || !cur.data) { showErr('the store did not record the discard (' + ((cur.error && cur.error.message) || 'no record') + ') -- kept on this phone'); return; }
  var m = Object.assign({}, cur.data.metadata || {}, { state: 'discarded', v: 2 });
  m.samples = HRCore.mergeSamples(m.samples || [], cp.samples || []);
  var body = { metadata: m };
  if (!cur.data.ended_at) body.ended_at = new Date(cp.ended_at || Date.now()).toISOString();
  var u = await PB.update(cp.pb_id, body);
  if (u.error) showErr('the store did not record the discard (' + (u.error.message || 'refused') + ') -- kept on this phone');
}

function hrResumeSession() {
  if (hrResumeState()) hrNavigateHR();
}
// The state half of a resume (W3b: a Lift RESUME resumes its HR session too, then shows the Lift screen).
function hrResumeState() {
  var cp = hrGetCheckpoint();
  if (!cp) return null;
  hrLiftSessionId = cp.lift_session_id || null;
  hrStartTime    = cp.started_at;
  hrExerciseType = cp.exercise_type || 'Cardio';
  hrSamples      = (cp.samples || []).slice();
  hrRRBuffer     = (cp.rr || []).slice();
  hrBuffer       = [];
  hrLastBpm      = cp.last_bpm || null;
  hrLastPacketAt = null;
  hrDevice = null; hrChar = null;
  hrSessionId    = cp.session_id || hrMintSessionId();
  if (hrStore) hrStore.adopt(cp.pb_id || null, cp.missed_ticks || 0);
  if (cp.ended_at) {                       // stopped but never filed → report
    hrEndTime = cp.ended_at;
    hrSessionActive = false;
    hrComputeSessionData();
    hrStoreWriteRetry('stopped');          // JA2: the store learns the stop (idempotent if it already did)
  } else {                                 // interrupted mid-capture → continue
    hrEndTime = null;
    hrSessionData = null;
    hrSessionActive = true;
    clearInterval(hrCheckpointTick);
    hrCheckpointTick = setInterval(hrSaveCheckpoint, 5000);
    hrStartStoreTicks();                   // JA2: first tick merges whatever the store holds
    hrRequestWakeLock();
  }
  return cp;
}

// ── BLE CONNECT / RECONNECT (A1) ───────────────────────────────────────────
async function hrAttach(device) {
  var server  = await device.gatt.connect();
  var service = await server.getPrimaryService('heart_rate');
  hrChar = await service.getCharacteristic('heart_rate_measurement');
  hrChar.addEventListener('characteristicvaluechanged', hrOnData);
  await hrChar.startNotifications();
}

async function hrConnect() {
  if (!navigator.bluetooth) {
    showErr('Web Bluetooth not supported in this browser. Use Chrome on Android.');
    return;
  }
  var btn = document.getElementById('hr-connect-btn');
  var statusEl = document.getElementById('hr-ble-status');
  if (statusEl) { statusEl.textContent = '◌ CONNECTING…'; statusEl.style.color = 'var(--state-warn)'; }
  if (btn) { btn.textContent = 'CONNECTING…'; btn.disabled = true; }

  try {
    var device = await navigator.bluetooth.requestDevice({
      filters: [{ services: ['heart_rate'] }]
    });
    hrDevice = device;
    device.addEventListener('gattserverdisconnected', hrOnDisconnect);
    await hrAttach(device);
    updateHRConnectState('connected');
  } catch(e) {
    updateHRConnectState('idle');
    if (e.name !== 'NotFoundError') {   // NotFoundError = user cancelled picker, not an error
      showErr('BLE: ' + (e.message || 'connection failed'));
      autoHideErr(5000);
    }
  }
}

// Manual re-pair from the locked view (required after a page reload — Web
// Bluetooth needs a user gesture to re-select the device).
async function hrManualReconnect() {
  if (!navigator.bluetooth) return;
  hrReconnectAttempts = 0;
  try {
    // JA2 §2.3 / Q8: a permitted device can be re-attached WITHOUT the chooser where
    // getDevices() exists (checked on the phone at S3); otherwise the picker as before.
    var device = null;
    if (typeof navigator.bluetooth.getDevices === 'function') {
      try {
        var known = await navigator.bluetooth.getDevices();
        device = (known || []).filter(function(d) { return !hrDevice || d.id === hrDevice.id; })[0] || null;
      } catch(e) { device = null; }
    }
    if (!device) {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
    }
    hrDevice = device;
    device.addEventListener('gattserverdisconnected', hrOnDisconnect);
    await hrAttach(device);
    hrReconnectAttempts = 0;
  } catch(e) { /* user cancelled or connect failed — ticker keeps state honest */ }
}

// Auto-reconnect loop (A1.3, bounded since JA2): retained device handle, retries per
// HRCore.reconnectPolicy while the session is active; after RECONNECT_MAX the loop
// stops and the manual button shows the count. The wall-clock timer never stops (A3).
function hrScheduleReconnect(delayMs) {
  clearTimeout(hrReconnectTimer);
  var plan = HRCore.reconnectPolicy(hrReconnectAttempts);
  if (!plan.retry) return;                               // the button carries it from here
  hrReconnectTimer = setTimeout(async function() {
    if (!hrSessionActive || !hrDevice || hrChar) return;
    hrReconnectAttempts++;
    try { await hrAttach(hrDevice); hrReconnectAttempts = 0; }
    catch(e) { hrScheduleReconnect(); }
  }, delayMs === undefined ? plan.delayMs : delayMs);
}

function hrOnData(event) {
  var value  = event.target.value;
  var flags  = value.getUint8(0);
  var is16   = flags & 0x01;
  var hasRR  = flags & 0x10;
  var bpm, offset;

  if (is16) { bpm = value.getUint16(1, true); offset = 3; }
  else      { bpm = value.getUint8(1);        offset = 2; }

  hrLastPacketAt = Date.now();

  // 5-reading rolling average for smooth display
  hrBuffer.push(bpm);
  if (hrBuffer.length > 5) hrBuffer.shift();
  var avgBpm = Math.round(hrBuffer.reduce(function(a, b) { return a + b; }, 0) / hrBuffer.length);
  hrLastBpm = avgBpm;

  var displayEl = document.getElementById('hr-live-bpm');
  if (displayEl) {
    displayEl.textContent = String(avgBpm).padStart(3, ' ');  // figure space for mono alignment
    displayEl.style.color = 'var(--state-ok)';
  }

  // A3: samples are stamped on the WALL CLOCK from session start. Signal loss
  // simply leaves holes in the timeline; hrProcessTimeline() resolves them at
  // session end (interpolate ≤ CAP, record > CAP as gaps).
  if (hrSessionActive && hrStartTime) {
    var elapsed = Math.floor((Date.now() - hrStartTime) / 1000);
    var last = hrSamples[hrSamples.length - 1];
    if (!last || elapsed - last.t >= 5) {
      hrSamples.push({ t: elapsed, bpm: avgBpm });
    }
  }

  // RR intervals arrive only in live packets — interpolated samples can never
  // contribute to RMSSD (J3 invariant, structural).
  if (hasRR && hrSessionActive) {
    var rrOffset = offset;
    while (rrOffset + 1 < value.byteLength) {
      var rrRaw = value.getUint16(rrOffset, true);
      hrRRBuffer.push(Math.round((rrRaw / 1024) * 1000));   // convert to ms
      rrOffset += 2;
    }
  }
}

function hrOnDisconnect() {
  hrChar = null;
  if (!hrSessionActive) {
    updateHRConnectState('idle');
    var displayEl = document.getElementById('hr-live-bpm');
    if (displayEl) { displayEl.textContent = '---'; displayEl.style.color = 'var(--state-err)'; }
    var statusEl = document.getElementById('hr-ble-status');
    if (statusEl) { statusEl.textContent = '✗ DISCONNECTED'; statusEl.style.color = 'var(--state-err)'; }
    return;
  }
  // Active session: timer keeps running (A3); auto-reconnect starts (A1).
  hrScheduleReconnect(0);
}

function updateHRConnectState(state) {
  var statusEl    = document.getElementById('hr-ble-status');
  var connectBtn  = document.getElementById('hr-connect-btn');
  var displayEl   = document.getElementById('hr-live-bpm');

  if (state === 'idle') {
    if (statusEl)   { statusEl.textContent = '● NOT CONNECTED'; statusEl.style.color = 'var(--state-err)'; }
    if (connectBtn) { connectBtn.textContent = connectBtn.dataset.idleLabel || 'CONNECT MONITOR'; connectBtn.disabled = false; }
    if (displayEl)  { displayEl.textContent = '---'; displayEl.style.color = 'var(--state-err)'; }
  } else if (state === 'connected') {
    if (statusEl)   { statusEl.textContent = '● CONNECTED'; statusEl.style.color = 'var(--state-ok)'; }
    if (connectBtn) { connectBtn.textContent = 'RECONNECT'; connectBtn.disabled = false; }
    if (displayEl)  { displayEl.style.color = 'var(--state-ok)'; }
  }
  hrUpdateStartGate();
  liftUpdateStartGate();   // W3b (L17): the Lift START waits on the same connection
}

// ── SESSION START + LOCKED CAPTURE VIEW (A4) ───────────────────────────────
function hrStartExercise() {
  if (!hrDevice || !hrDevice.gatt.connected) {
    showErr('Connect the monitor first'); autoHideErr(4000); return;
  }
  if (!hrExerciseType) {
    showErr('Select an exercise type first'); autoHideErr(4000); return;
  }
  // JA2 §2.2: never start over an unfiled session — the 21 Sep loss was exactly this tap.
  var guard = HRCore.startGuard(hrGetCheckpoint() || hrGetSlot(HR_OTHER_KEY), null, hrFmtStart);
  if (guard) { navigate('#home'); setTimeout(function() { showErr(guard.message); autoHideErr(10000); }, 150); return; }   // shown after home re-renders
  hrBeginCapture(null);
  hrRenderLockedView();
}
// The capture's start, shared by the HR screen and the Lift START (W3b, L17: ONE capture path; the
// Lift session's id rides the HR session from START, Q3 (c)). The caller has run its START guard.
function hrBeginCapture(liftSessionId) {
  hrStartTime    = Date.now();
  hrEndTime      = null;
  hrLastPacketAt = null;
  hrSamples      = [];
  hrRRBuffer     = [];
  hrSessionData  = null;
  hrSessionActive = true;
  hrSessionId    = hrMintSessionId();
  hrLiftSessionId = liftSessionId || null;
  if (hrStore) hrStore.adopt(null, 0);

  hrRequestWakeLock();   // keep screen on — screen sleep suspends Web Bluetooth
  hrSaveCheckpoint();
  clearInterval(hrCheckpointTick);
  hrCheckpointTick = setInterval(hrSaveCheckpoint, 5000);   // A1: 5 s checkpoint
  hrStartStoreTicks();                                       // JA2: the store copy — first write now, then every STORE_TICK_SEC
}
