      (linked
        ? '<div style="margin:0 var(--s-9) calc(var(--s-11) + env(safe-area-inset-bottom, 0px))">' +
            '<button class="btn-primary" id="hr-back-to-lift" onclick="navigate(\'#log/resistance\')">&lsaquo; BACK TO LIFT</button>' +
            '<div class="hr-gap-note" style="color:var(--on-navy-fg-dim);text-align:center">stops and files with the Lift session: FINISH &amp; FILE there</div>' +
          '</div>'
        : '<div class="hr-stop-track" id="hr-stop-track">' +
            '<span class="hr-stop-track__label">&larr; SLIDE TO STOP</span>' +
            '<div class="hr-stop-handle" id="hr-stop-handle">&#10073;&#10073;</div>' +
          '</div>') +
    '</div>' +
    '<div class="hr-confirm-overlay" id="hr-confirm-overlay" style="display:none">' +
      '<div class="hr-confirm-box">' +
        '<div class="hr-confirm-box__title">End session?</div>' +
        '<button class="btn-primary" style="background:var(--state-err)" onclick="hrConfirmEnd()">CONFIRM &middot; END SESSION</button>' +
        '<div style="height:var(--s-9)"></div>' +
        '<button class="btn-secondary" onclick="hrCancelEnd()">CANCEL &middot; KEEP RECORDING</button>' +
      '</div>' +
    '</div>';

  hrInitStopSwipe();
  hrStartLockedTicker();
}

// 1 s ticker: wall-clock timer (A3 — never stops), connection state, signal-
// lost elapsed, reconnect button visibility.
function hrStartLockedTicker() {
  clearInterval(hrTimerTick);
  hrTimerTick = setInterval(function() {
    var el = document.getElementById('hr-timer');
    if (!el) { clearInterval(hrTimerTick); return; }
    el.textContent = fmtDur(Date.now() - hrStartTime);
    var silent = !hrLastPacketAt || (Date.now() - hrLastPacketAt > 10000);
    var down   = !hrChar || silent;
    el.style.color = down ? 'var(--state-warn)' : 'var(--on-navy-fg)';

    var st = document.getElementById('hr-ble-status');
    if (st) {
      if (!hrChar && !hrDevice)      { st.innerHTML = '&#10007; DISCONNECTED';        st.style.color = 'var(--state-err)';  }
      else if (!hrChar)              { st.innerHTML = '&#9676; RECONNECTING&hellip;'; st.style.color = 'var(--state-warn)'; }
      else if (silent)               { st.innerHTML = '&#9676; NO SIGNAL';            st.style.color = 'var(--state-warn)'; }
      else                           { st.innerHTML = '&#9679; CONNECTED';            st.style.color = 'var(--state-ok)';   }
    }
    var note = document.getElementById('hr-gap-note');
    if (note) {
      if (down) {
        var since = Math.max(hrLastPacketAt || 0, hrStartTime);
        note.textContent = 'SIGNAL LOST · ' + fmtDur(Date.now() - since);
        note.style.display = '';
      } else note.style.display = 'none';
    }
    var ss = document.getElementById('hr-store-status');   // JA2: the store copy's age, or how many ticks it missed
    if (ss) { ss.textContent = hrStoreStatusText(); ss.style.color = (hrStore && hrStore.state.missed) ? 'var(--state-err)' : 'var(--on-navy-fg-dim)'; }
    var rb = document.getElementById('hr-reconnect-btn');
    if (rb) {
      rb.style.display = hrChar ? 'none' : '';
      rb.textContent = hrReconnectAttempts >= HRCore.RECONNECT_MAX
        ? 'RECONNECT MONITOR · auto gave up after ' + hrReconnectAttempts
        : (hrReconnectAttempts ? 'RECONNECT MONITOR · try ' + hrReconnectAttempts + '/' + HRCore.RECONNECT_MAX : 'RECONNECT MONITOR');
    }
    var bpmEl = document.getElementById('hr-live-bpm');
    if (bpmEl && down) bpmEl.style.color = 'var(--state-err)';
  }, 1000);
}

// ── SWIPE-TO-STOP + CONFIRM (A5) ───────────────────────────────────────────
function hrInitStopSwipe() {
  var track  = document.getElementById('hr-stop-track');
  var handle = document.getElementById('hr-stop-handle');
  if (!track || !handle) return;
  var startX = null, dx = 0, maxTravel = 0;

  handle.addEventListener('pointerdown', function(e) {
    startX = e.clientX; dx = 0;
    maxTravel = track.getBoundingClientRect().width - handle.getBoundingClientRect().width - 8;
    handle.style.transition = 'none';
    handle.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  handle.addEventListener('pointermove', function(e) {
    if (startX === null) return;
    dx = Math.max(-maxTravel, Math.min(0, e.clientX - startX));   // right-to-left only
    handle.style.transform = 'translateX(' + dx + 'px)';
  });
  function settle(armed) {
    startX = null;
    handle.style.transition = 'transform 180ms ease-out';
    handle.style.transform = 'translateX(0)';
    if (armed) hrShowConfirm();
  }
  handle.addEventListener('pointerup', function() {
    if (startX === null) return;
    settle(maxTravel > 0 && -dx >= maxTravel * 0.8);   // full-ish swipe arms confirm
  });
  handle.addEventListener('pointercancel', function() { if (startX !== null) settle(false); });
}

function hrShowConfirm()  { var o = document.getElementById('hr-confirm-overlay'); if (o) o.style.display = ''; }
function hrCancelEnd()    { var o = document.getElementById('hr-confirm-overlay'); if (o) o.style.display = 'none'; }
function hrConfirmEnd()   { hrCancelEnd(); hrEndExercise(); }

// ── SCREEN WAKE LOCK ── screen off = page suspended = no BLE data ──────────
async function hrRequestWakeLock() {
  if (!('wakeLock' in navigator)) return;   // unsupported — checkpoint still protects data
  try {
    hrWakeLock = await navigator.wakeLock.request('screen');
    hrWakeLock.addEventListener('release', function() { hrWakeLock = null; });
  } catch(e) { /* denied (battery saver etc.) — non-fatal, timeline gaps stay honest */ }
}

function hrReleaseWakeLock() {
  if (hrWakeLock) { hrWakeLock.release().catch(function(){}); hrWakeLock = null; }
}

// Wake locks auto-release when the page is hidden — reacquire on return. Since JA2
// (§2.3): coming back to the foreground with the strap gone also restarts the
// reconnect loop from attempt 0, and asks for a store tick if one is due.
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState !== 'visible' || !hrSessionActive) return;
  hrRequestWakeLock();
  if (!hrChar && hrDevice) { hrReconnectAttempts = 0; hrScheduleReconnect(0); }
  hrStoreTickMaybe();
});
// The page being torn down (a tab swipe, a new window, the OS freezing it): write the
// checkpoint and flush the store copy with a keepalive PATCH that outlives the page.
function hrFlushOnHide() {
  if (!hrSessionActive) return;
  hrSaveCheckpoint();
  if (!db || !hrStore || !hrStore.state.pbId) return;
  try {
    var body = { metadata: HRCore.checkpointPayload(Object.assign(hrSnapshot(), { state: 'active' }), new Date().toISOString()) };
    PB.flush(hrStore.state.pbId, body);   // keepalive: true, with the token (pb-client.js)
  } catch(e) { /* best effort — the next tick or the launch recovery covers it */ }
}
window.addEventListener('pagehide', hrFlushOnHide);
document.addEventListener('freeze', hrFlushOnHide);

// ── SESSION END + TIMELINE RESOLUTION (A3) ─────────────────────────────────
function hrEndExercise() {
  if (!hrStartTime) { showErr('No active session'); return; }
  hrStopCapture();
  hrRenderReportView();
}
// The stop, shared with the Lift FINISH (W3b, L20), which files the session itself and shows no report.
function hrStopCapture() {
  hrEndTime = Date.now();
  hrSessionActive = false;
  clearInterval(hrTimerTick);
  clearInterval(hrCheckpointTick);
  clearTimeout(hrReconnectTimer);
  hrReleaseWakeLock();
  if (hrChar) hrChar.stopNotifications().catch(function(){});

  hrComputeSessionData();
  hrSaveCheckpoint();          // persists ended_at — survives reload before LOG IT
  clearInterval(hrStoreTickTimer);
  hrStoreWriteRetry('stopped');   // JA2: the store learns the stop; retried, never swallowed
}

function hrComputeSessionData() {
  var durationSec = Math.max(1, Math.floor((hrEndTime - hrStartTime) / 1000));
  var tl = hrProcessTimeline(hrSamples, durationSec);

  // Stats from REAL samples only — synthetic points never move avg/max/min
  var real = tl.samples.filter(function(s) { return !s.est; });
  var bpms = real.map(function(s) { return s.bpm; });
  var bpmAvg = bpms.length ? Math.round(bpms.reduce(function(a,b){return a+b;},0) / bpms.length) : 0;
  var bpmMax = bpms.length ? Math.max.apply(null, bpms) : 0;
  var bpmMin = bpms.length ? Math.min.apply(null, bpms) : 0;
  var rmssd  = hrCalcRMSSD(hrRRBuffer);
  var zoneTimes = hrCalcZoneTimes(tl.samples, durationSec, tl.gaps);

  hrSessionData = {
    exercise_type:  hrExerciseType || 'Cardio',
    duration_sec:   durationSec,                              // wall clock (A3)
    active_sec:     Math.max(0, durationSec - tl.gap_sec),    // real + interpolated
    bpm_avg:        bpmAvg,
    bpm_max:        bpmMax,
    bpm_min:        bpmMin,
    rmssd_ms:       rmssd,
    zone_time_sec:  zoneTimes,
    samples:        tl.samples,
  };
  if (tl.est_sec > 0) hrSessionData.est_sec = Math.round(tl.est_sec);   // synthetic fraction, auditable
  if (tl.gap_sec > 0) { hrSessionData.gap_sec = Math.round(tl.gap_sec); hrSessionData.gaps = tl.gaps; }
}

// Resolve holes in the wall-clock sample timeline:
//   hole ≤ HR_GAP_CAP_SEC AND bounded by real data on both sides →
//     fill 5 s slots, linear between the 30 s means either side, est:true
//   otherwise → record {start,end} in gaps — NEVER fabricate (J3)
function hrProcessTimeline(rawSamples, durationSec) {
  var src = rawSamples.slice().sort(function(a, b) { return a.t - b.t; });
  var samples = [], gaps = [], est_sec = 0, gap_sec = 0;

  function meanNear(fromT, toT) {
    var v = [];
    for (var i = 0; i < src.length; i++) {
      if (src[i].t >= fromT && src[i].t <= toT) v.push(src[i].bpm);
    }
    return v.length ? v.reduce(function(a,b){return a+b;},0) / v.length : null;
  }

  if (!src.length) {                          // no data at all
    if (durationSec > 0) { gaps.push({ start: 0, end: durationSec }); gap_sec = durationSec; }
    return { samples: samples, gaps: gaps, gap_sec: gap_sec, est_sec: 0 };
  }

  // Head hole (no left boundary → cannot interpolate, any size is a gap)
  if (src[0].t > HR_HOLE_MIN_SEC) {
    gaps.push({ start: 0, end: src[0].t });
    gap_sec += src[0].t;
  }

  for (var i = 0; i < src.length; i++) {
    samples.push(src[i]);
    var next = src[i + 1];
    if (!next) break;
    var hole = next.t - src[i].t;
    if (hole <= HR_HOLE_MIN_SEC) continue;    // sampling jitter, not signal loss
    var holeStart = src[i].t + 5, holeEnd = next.t;
    if (hole <= HR_GAP_CAP_SEC) {
      var pre  = meanNear(src[i].t - 30, src[i].t);
      var post = meanNear(next.t, next.t + 30);
      if (pre !== null && post !== null) {
        for (var t = holeStart; t < holeEnd; t += 5) {
          var f = (t - src[i].t) / (next.t - src[i].t);
          samples.push({ t: t, bpm: Math.round(pre + (post - pre) * f), est: true });
        }
        est_sec += holeEnd - holeStart;
        continue;
      }
    }
    gaps.push({ start: holeStart, end: holeEnd });
    gap_sec += holeEnd - holeStart;
  }

  // Tail hole (no right boundary → gap, any size)
  var lastT = src[src.length - 1].t;
  if (durationSec - lastT > HR_HOLE_MIN_SEC) {
    gaps.push({ start: lastT + 5, end: durationSec });
    gap_sec += durationSec - (lastT + 5);
  }

  samples.sort(function(a, b) { return a.t - b.t; });
  return { samples: samples, gaps: gaps, gap_sec: gap_sec, est_sec: est_sec };
}

function hrCalcRMSSD(rrArray) {
  if (!rrArray || rrArray.length < 2) return null;
  var sumSq = 0;
  for (var i = 1; i < rrArray.length; i++) {
    var diff = rrArray[i] - rrArray[i - 1];
    sumSq += diff * diff;
  }
  return Math.round(Math.sqrt(sumSq / (rrArray.length - 1)));
}

// Zone attribution over the resolved timeline. Unfilled holes (recorded gaps)
// land in an explicit `gap` bucket — surfaced honestly, never zone-classified.
function hrCalcZoneTimes(samples, totalSec, gaps) {
  var times = { sub1: 0, z1: 0, z2: 0, z3: 0, z4: 0, z5: 0 };
  var gapTotal = 0;
  (gaps || []).forEach(function(g) { gapTotal += Math.max(0, g.end - g.start); });

  for (var i = 0; i < samples.length; i++) {
    var s = samples[i], next = samples[i + 1];
    var to  = next ? next.t : totalSec;
    var dur = to - s.t;
    if (dur <= 0) continue;
    if (dur > HR_HOLE_MIN_SEC) continue;      // spans a recorded gap — counted in gapTotal
    var zone = HR_ZONES.find(function(z) { return s.bpm >= z.min && s.bpm <= z.max; });
    if (!zone) zone = HR_ZONES[0];
    times[zone.key] += dur;
  }
  if (gapTotal > 0) times.gap = Math.round(gapTotal);
  return times;
}

// ── CHARTS ─────────────────────────────────────────────────────────────────
// A6: also used by Log Review to re-render stored sessions. est samples are
// drawn dashed; recorded gaps are greyed — data quality is visible, always.
function hrBuildLineChart(samples, width, height, gaps) {
  if (!samples || samples.length < 2) {
    return '<div class="empty-state" style="padding:var(--s-9)">Insufficient data for chart</div>';
  }
  gaps = gaps || [];
  var pad = { top: 20, right: 12, bottom: 28, left: 38 };
  var W   = width  - pad.left - pad.right;
  var H   = height - pad.top  - pad.bottom;

  var maxT = samples[samples.length - 1].t || 1;
  gaps.forEach(function(g) { if (g.end > maxT) maxT = g.end; });

  var realS  = samples.filter(function(s) { return !s.est; });
  var bpms   = (realS.length ? realS : samples).map(function(s) { return s.bpm; });
  var rawMin = Math.min.apply(null, bpms);
  var rawMax = Math.max.apply(null, bpms);
  var yMin   = Math.max(40,  rawMin - 15);
  var yMax   = Math.min(185, rawMax + 15);
  if (yMax <= yMin) yMax = yMin + 10;

  function xScale(t)   { return (t   / maxT)         * W; }
  function yScale(bpm) { return H - ((bpm - yMin) / (yMax - yMin)) * H; }

  // Zone background bands
  var bands = HR_ZONES.map(function(z) {
    var bandTop    = Math.max(0, Math.min(H, yScale(z.max + 1)));
    var bandBottom = Math.max(0, Math.min(H, yScale(z.min)));
    if (bandBottom <= bandTop) return '';
    return '<rect x="0" y="' + bandTop.toFixed(1) + '" width="' + W + '" height="' +
      (bandBottom - bandTop).toFixed(1) + '" fill="' + z.color + '" opacity="0.10"/>';
  }).join('');

  // Signal-lost regions greyed
  var gapRects = gaps.map(function(g) {
    var x1 = Math.max(0, xScale(g.start)), x2 = Math.min(W, xScale(g.end));
    if (x2 <= x1) return '';
    return '<rect x="' + x1.toFixed(1) + '" y="0" width="' + (x2 - x1).toFixed(1) +
      '" height="' + H + '" fill="#475569" opacity="0.15"/>';
  }).join('');

  // Trace: solid for real segments, dashed for interpolated; never drawn
  // across an unfilled hole.
  var solid = '', dashed = '';
  for (var i = 0; i < samples.length - 1; i++) {
    var a = samples[i], b = samples[i + 1];
    if (b.t - a.t > HR_HOLE_MIN_SEC) continue;
    var seg = 'M' + xScale(a.t).toFixed(1) + ' ' + yScale(a.bpm).toFixed(1) +
              'L' + xScale(b.t).toFixed(1) + ' ' + yScale(b.bpm).toFixed(1);
    if (a.est || b.est) dashed += seg; else solid += seg;
  }

  // Y-axis labels (3 values)
  var yVals = [yMin, Math.round((yMin + yMax) / 2), yMax];
  var yLabels = yVals.map(function(v) {
    return '<text x="-5" y="' + yScale(v).toFixed(1) + '" text-anchor="end" ' +
      'font-size="9" fill="#94a3b8" dominant-baseline="middle" font-family="monospace">' + v + '</text>';
  }).join('');

  // X-axis labels — 30 s granularity for short sessions, m:ss when needed
  var xLabels = '';
  var xStepSec = Math.max(30, Math.ceil(maxT / 4 / 30) * 30);
  var wholeMin = (xStepSec % 60 === 0);
  for (var t = 0; t <= maxT; t += xStepSec) {
    var xPos = xScale(t);
    var lbl  = wholeMin ? (Math.floor(t / 60) + 'm')
                        : (Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'));
    xLabels += '<text x="' + xPos.toFixed(1) + '" y="' + (H + 18) + '" text-anchor="middle" ' +
      'font-size="9" fill="#94a3b8" font-family="monospace">' + lbl + '</text>';
  }

  // Axes
  var axes =
    '<line x1="0" y1="' + H + '" x2="' + W + '" y2="' + H + '" stroke="#d6cfbf" stroke-width="1"/>' +
    '<line x1="0" y1="0" x2="0" y2="' + H + '" stroke="#d6cfbf" stroke-width="1"/>';

  return '<svg viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg" ' +
    'style="width:100%;height:auto;display:block">' +
    '<g transform="translate(' + pad.left + ',' + pad.top + ')">' +
      bands + gapRects +
      '<path d="' + solid + '" fill="none" stroke="#3a8fd1" stroke-width="2" ' +
        'stroke-linejoin="round" stroke-linecap="round"/>' +
      (dashed ? '<path d="' + dashed + '" fill="none" stroke="#3a8fd1" stroke-width="1.5" ' +
        'stroke-dasharray="4 3" opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/>' : '') +
      yLabels + xLabels + axes +
    '</g></svg>';
}

function hrBuildZoneChart(zoneTimes, totalSec) {
  if (!totalSec) return '<div class="empty-state">No zone data</div>';
  var rows = HR_ZONES.map(function(z) {
    var sec = (zoneTimes && zoneTimes[z.key]) || 0;
    var pct = totalSec > 0 ? Math.round((sec / totalSec) * 100) : 0;
    var mm  = Math.floor(sec / 60);
    var ss  = sec % 60;
    var timeStr = mm + ':' + String(ss).padStart(2, '0');
    return '<div style="margin-bottom:var(--s-7)">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">' +
        '<span style="font:600 10px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:' +
          (sec > 0 ? 'var(--ink)' : 'var(--ink-muted)') + '">' + z.label + '</span>' +
        '<span style="font:400 11px/1 var(--font-mono);color:var(--ink-dim)">' + timeStr + '</span>' +
      '</div>' +
      '<div style="height:12px;background:var(--paper-edge);border:1px solid var(--paper-line)">' +
        '<div style="height:100%;width:' + pct + '%;background:' + z.color +
          ';opacity:' + (sec > 0 ? '0.85' : '0') + ';transition:width .3s ease"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  // Explicit unclassified bucket for signal-lost time (J3 — surfaced honestly)
  var gapSec = (zoneTimes && zoneTimes.gap) || 0;
  if (gapSec > 0) {
    var gpct = totalSec > 0 ? Math.round((gapSec / totalSec) * 100) : 0;
    rows += '<div style="margin-bottom:var(--s-7)">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">' +
        '<span style="font:600 10px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)">Signal Lost · Unclassified</span>' +

// ── FILE THE ENTRY ─────────────────────────────────────────────────────────
async function submitHeartRate() {
  if (!hrSessionData) { showErr('No session data — complete a session first'); return; }
  var startISO = hrStartTime ? new Date(hrStartTime).toISOString() : new Date().toISOString();
  var endISO   = new Date(hrEndTime || (hrStartTime + hrSessionData.duration_sec * 1000)).toISOString();
  var noteEl   = document.getElementById('f-hr-note');
  var note     = noteEl ? noteEl.value.trim() || null : null;

  // JA2: a session the store already holds is FILED by a PATCH to state "filed"; one the
  // store never saw (offline throughout) is created now, in the v2 shape.
  var ok = (hrStore && hrStore.state.pbId)
    ? await hrFileEntry(note)
    : await writeEntry('heart_rate', startISO, endISO, note,
                       HRCore.checkpointPayload(Object.assign(hrSnapshot(), { state: 'filed' }), new Date().toISOString()));
  if (!ok) return;             // write failed — keep checkpoint + state for retry

  hrClearCheckpoint();         // filed — checkpoint no longer needed
  hrResetState();
}

async function hrFileEntry(note) {
  setBtnLoading(true); clearErr();
  var ok = await hrStoreWriteRetry('filed', note, 2);
  var rec = ok ? await PB.get(hrStore.state.pbId) : null;
  setBtnLoading(false);
  if (!ok || !rec || rec.error || !rec.data) { showErr('could not file to the store — the session is kept; retry'); autoHideErr(6000); return false; }
  confirmEntry = rec.data;
  navigate('#confirm');
  return true;
}

// ── CORE WRITE ─────────────────────────────────────────────────────────────
async function writeEntry(type, startedAt, endedAt, notes, metadata) {
  setBtnLoading(true); clearErr();
  if (!db) { showErr('Backend not configured'); setBtnLoading(false); return false; }
  var result = await PB.insert({
    entry_type: type, started_at: startedAt,
    ended_at: endedAt || null, notes: notes || null, metadata: metadata,
  });
  setBtnLoading(false);
  if (result.error) { showErr(result.error.message || 'could not write entry — retry'); autoHideErr(6000); return false; }
  confirmEntry = result.data;
  navigate('#confirm');
  return true;
}

async function undoEntry(id, intervalId) {
  clearInterval(intervalId);
  if (db && id) {
    var r;
    if (confirmEntry && confirmEntry.entry_type === 'heart_rate') {   // JA2 §1.3: a session is never deleted — undo = discard (restorable in Log Review)
      r = await PB.update(id, { metadata: Object.assign({}, confirmEntry.metadata || {}, { state: 'discarded' }) });
    } else if (confirmEntry && confirmEntry.entry_type === LiftCore.ENTRY_TYPE) {   // W3b §3 Q2: the HR rule — discard, never a DELETE (L18)
      r = await PB.update(id, { metadata: LiftCore.checkpointPayload(confirmEntry.metadata, 'discarded', new Date().toISOString()) });
      if (!r.error) { var hrWhy = await liftUndoLinkedHr(confirmEntry); if (hrWhy) { showSafBackOnly(hrWhy); return; } }
    } else r = await PB.remove(id);
    // W2 (C-8): a refused undo says so and stays here -- the entry is still filed
    if (r.error) { showSafBackOnly('undo refused (' + (r.error.message || r.error.status) + ') -- the entry is still filed'); return; }
  }
  confirmEntry = null;
  navigate('#home');
}

// ── UTILS ──────────────────────────────────────────────────────────────────
function fmtHeaderDate(d) {
  return d.toLocaleDateString('en-US', { year:'numeric', month:'2-digit', day:'2-digit' }) +
    ' · ' + d.toLocaleDateString('en-US', { weekday:'long' });
}
function fmtDur(ms) {
  var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000);
  return pad(h) + ':' + pad(m) + ':' + pad(s);
}
function pad(n) { return String(n).padStart(2, '0'); }
function ago(d) {
  var diff = Date.now() - d;
  if (diff < 60000)    return 'just now';
  if (diff < 3600000)  return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function toLocalDatetimeInput(d) {
  var p = function(n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// ── LOG REVIEW ─────────────────────────────────────────────────────────────
function formatMetaReadable(type, meta, notes, startedAt, endedAt) {
  var rows = [];
  function row(k, v) { if (v !== null && v !== undefined && v !== '') rows.push({ k: k, v: String(v) }); }
  var fmtTime = function(iso) {
    return iso ? new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }) : '';
  };
  row('logged', fmtTime(startedAt));
  switch (type) {
    case 'heart_rate':
      var mmssRow = function(sec) { return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); };
      row('exercise',    meta.exercise_type || '');
      var durM = Math.floor((meta.duration_sec || 0) / 60);
      var durS = (meta.duration_sec || 0) % 60;
      row('duration',    durM + ' min ' + String(durS).padStart(2,'0') + ' sec');
      // JA schema (2026-07): wall-clock duration + explicit gap/est accounting
      if (meta.active_sec !== undefined && meta.active_sec !== meta.duration_sec)
        row('active', mmssRow(meta.active_sec));
      if (meta.gap_sec) row('signal lost', mmssRow(meta.gap_sec) + ' (not interpolated)');
      if (meta.est_sec) row('interpolated', mmssRow(meta.est_sec) + ' (est, labelled)');
      // Legacy v6 schema (pre-JA): watchdog paused time
      if (meta.paused_sec) row('paused', mmssRow(meta.paused_sec) + ' (BLE dropout)');
      row('avg bpm',     meta.bpm_avg || '');
      row('max bpm',     meta.bpm_max || '');
      row('min bpm',     meta.bpm_min || '');
      if (meta.rmssd_ms) row('hrv rmssd', meta.rmssd_ms + ' ms');
      if (meta.zone_time_sec) {
        var zt = meta.zone_time_sec;
        HR_ZONES.forEach(function(z) {
          var s = zt[z.key] || 0;
          if (s > 0) row(z.label.toLowerCase(), mmssRow(s));
        });
        if (zt.gap) row('unclassified', mmssRow(zt.gap) + ' (signal lost)');
      }
      break;
    case 'resistance':   // W3b: what filed, in words (the numbers are LiftCore's: the same the views serve)
      liftReadableRows(meta).forEach(function(r) { row(r.k, r.v); });
      break;
    case 'fast':
      if (endedAt) {
        var dur = ((new Date(endedAt) - new Date(startedAt)) / 3600000).toFixed(1);
        row('duration', dur + ' hours');
        row('ended', fmtTime(endedAt));
      } else {
        row('status', 'in progress');
      }
      row('type', meta.fast_type || 'manual');
      if (meta.last_meal_at) row('last meal', fmtTime(meta.last_meal_at));
      break;
    case 'supplement':
      var taken = meta.taken || [];
      if (taken.length) {
        taken.forEach(function(s) { row('taken', s.name + ' · ' + s.dose); });
      }
      var skipped = (meta.skipped || []).filter(function(s) { return s.reason !== 'hold'; });
      if (skipped.length) row('skipped', skipped.map(function(s) { return s.name; }).join(', '));
      if (meta.preset_time && meta.preset_time !== 'now') row('time preset', meta.preset_time);
      break;
    case 'sauna':
      row('type', meta.type || meta.heat_type || '');
      row('temperature', (meta.temp_f || meta.temperature_f || '') + ' °F');
      row('duration', (meta.duration_min || '') + ' min');
      if (meta.location) row('location', meta.location);
      break;
    case 'red_light':
      row('zone', meta.zone || meta.area || '');
      row('duration', (meta.duration_min || '') + ' min');
      if (meta.wavelength) row('wavelength', meta.wavelength);
      if (meta.distance_cm) row('distance', meta.distance_cm + ' cm');
      break;
    case 'alcohol':
      row('drinks', meta.drinks || '');
      row('type', meta.type || '');
      break;
    case 'massage':
      row('duration', (meta.duration_min || '') + ' min');
      row('type', meta.type || '');
      break;
    case 'flight':
      row('route', (meta.from || '') + ' → ' + (meta.to || ''));
      if (meta.departure_time) row('departure', meta.departure_time);
      break;
    case 'timezone':
      row('from', meta.from_tz || '');
      row('to', meta.to_tz || '');
      if (meta.offset_hours !== null && meta.offset_hours !== undefined)
        row('offset', (meta.offset_hours >= 0 ? '+' : '') + meta.offset_hours + ' hours');
      break;
    case 'note':
      row('category', meta.category || '');
      row('text', meta.text || notes || '');
      break;
    default:
      Object.keys(meta).forEach(function(k) {
        var v = meta[k];
        if (typeof v !== 'object') row(k, v);
      });
  }
  if (notes && type !== 'note') row('notes', notes);
  return rows;
}

    if (countEl) countEl.textContent = '0 entries';
    return;
  }
  // JA2 §2.4: discarded sessions are hidden unless asked for; in-progress / unfiled are labelled
  var data = result.data.filter(function(e) { return rvShowDiscarded || HRCore.stateOf(e) !== 'discarded'; });
  var nDiscarded = result.data.filter(function(e) { return HRCore.stateOf(e) === 'discarded'; }).length;

  if (countEl) countEl.textContent = data.length + (data.length === 1 ? ' entry' : ' entries');
  document.getElementById('rv-list').innerHTML = data.map(function(e, idx) {
    var m       = EMETA[e.entry_type] || { code: e.entry_type.substring(0,2).toUpperCase(), label: e.entry_type };
    var meta    = e.metadata || {};
    var timeStr = new Date(e.started_at).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false });
    var lift    = e.entry_type === LiftCore.ENTRY_TYPE;
    var st      = (e.entry_type === 'heart_rate' || lift) ? HRCore.stateOf(e) : 'filed';
    var stLabel = st === 'active' ? 'IN PROGRESS' : st === 'stopped' ? 'UNFILED' : st === 'discarded' ? 'DISCARDED' : '';
    var readable = formatMetaReadable(e.entry_type, meta, e.notes, e.started_at, e.ended_at);
    var lastWrite = meta.checkpoint_at ? new Date(meta.checkpoint_at).toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', hour12:false }) : '—';
    if (st === 'active' && lift) { var lp = liftProgressOf(meta); readable = [{ k: 'state', v: 'in progress · ' + lp.confirmed + ' of ' + lp.total + ' sets confirmed · last store write ' + lastWrite }]; }
    else if (st === 'active') readable = [{ k: 'state', v: 'in progress · ' + HRCore.summarize(meta.samples || []).count + ' samples · last store write ' + lastWrite }];

    var detailRows = readable.map(function(r) {

    if (e.entry_type === 'heart_rate' && meta.samples && meta.samples.length >= 2) {
      detailRows += '<div style="padding:8px 0 4px">' +

    if (st === 'discarded' && lift) detailRows += '<button class="btn-secondary" style="margin-top:8px;color:var(--ink);border-color:var(--paper-line)" onclick="event.stopPropagation();liftRestoreFromReview(\'' + e.id + '\')">RESTORE (to filed)</button>';
    else if (st === 'discarded') detailRows += '<button class="btn-secondary" style="margin-top:8px" onclick="event.stopPropagation();hrRestoreFromReview(\'' + e.id + '\')">RESTORE (to unfiled)</button>';
    return '<div class="review-entry" onclick="toggleReviewDetail(' + idx + ')">' +
      '<div class="review-entry__head">' +
        '<span class="review-entry__code">' + m.code + '</span>' +
        '<span class="review-entry__label">' + m.label + (stLabel ? ' &middot; ' + stLabel : '') + '</span>' +

// JA2 §2.4: a stopped-but-unfiled session is filed from review through the normal report
// flow (the record becomes the checkpoint, RESUME shows the report, LOG IT patches "filed").
async function hrFileFromReview(id) {
  if (hrSessionActive || hrGetCheckpoint()) { showErr('Finish or discard the current session first'); autoHideErr(4000); return; }
  var r = await PB.get(id);
  if (r.error || !r.data) { showErr('could not load the session from the store'); autoHideErr(4000); return; }
  hrSaveCheckpointFromStore(r.data, true);
  hrResumeSession();
}
// A discarded session comes back as unfiled. Nothing is deleted in either direction.
async function hrRestoreFromReview(id) {
  var r = await PB.get(id);
  if (r.error || !r.data) { showErr('could not load the session from the store'); autoHideErr(4000); return; }
  var m = Object.assign({}, r.data.metadata || {}, { state: 'stopped', v: 2 });
  var u = await PB.update(id, { metadata: m });
  if (u.error) { showErr('could not restore — retry'); autoHideErr(4000); return; }
  render();
}

// ── LIFT (W3b: resistance logging) ─────────────────────────────────────────
// Built from W3b_Mock/index.html in the journal's classes. Every rule is lift-core.js's (L1–L20);
// this script renders, wires the HR capture it shares (ONE connect / capture / store path), and
// keeps the durability the HR session has: the local copy on every change, the store from START,
// a page-hide flush, launch recovery (the store first), a START guard, nothing deleted.

// The local copy (brief §1.3): LiftCore's shape, so HRCore.resumeDecision reads it as it reads hr_session.
function liftGetLocal() {
  try { var s = JSON.parse(localStorage.getItem(LIFT_KEY)); return (s && s.v === LiftCore.META_V && s.session_id && s.meta) ? s : null; }
  catch (e) { return null; }

}
function liftClearLocal() { try { localStorage.removeItem(LIFT_KEY); } catch (e) {} }
function liftSaveLocalFromStore(rec, stale) {
  var m = rec.metadata || {};
  var s = { v: LiftCore.META_V, session_id: m.session_id, started_at: Date.parse(String(rec.started_at).replace(' ', 'T')),
            pb_id: rec.id, missed: 0, meta: m };
  if (stale) { var last = Date.parse(String(m.checkpoint_at || rec.started_at).replace(' ', 'T')); s.ended_at = isNaN(last) ? s.started_at : last; }
  try { localStorage.setItem(LIFT_KEY, JSON.stringify(s)); } catch (e) {}
}

function liftStrapLinked() { return !!(liftSession && liftSession.meta && liftSession.meta.hr_mode === 'strap'); }

}

// Bluetooth gesture). A FINISHED Lift session is not paired: its FILE files the Lift record only, so the HR session keeps its own banner.
function liftPairsHr() {

    var now = Date.now();

function liftUtcOffsetS(ms) { return 0 - new Date(ms).getTimezoneOffset() * 60; }   // the phone's offset at START (D-57 (10)); east positive

// ── START (L4–L10, L17, L18) ──
function liftStart() {
  var c = liftCanStart();

  // Never over an unfiled Lift or HR session (the JA2 guard, the Lift half first).
  var guard = LiftCore.startGuard({ local: liftGetLocal(), storeOpen: null },
                                  { local: hrGetCheckpoint() || hrGetSlot(HR_OTHER_KEY), storeOpen: null }, hrFmtStart);
  if (guard) { navigate('#home'); setTimeout(function() { showErr(guard.message); autoHideErr(10000); }, 150); return; }   // shown after home re-renders
  var tpl = liftSelectedTemplate(), sid = hrMintSessionId(), now = Date.now();
  liftSession = LiftCore.startSession(tpl, liftHistoryOk ? liftHistory : [],
    { sessionId: sid, nowMs: now, utcOffsetS: liftUtcOffsetS(now), hrMode: liftPick.hrMode,
      hrSessionId: liftPick.hrMode === 'link' ? liftPick.hrLink : null });
  liftStore.adopt(null, 0);
  liftStore.touch();
  liftSaveLocal();
  if (liftSession.meta.hr_mode === 'strap') {   // ONE START for both (D-60 (2)): the HR capture, typed Weightlifting, naming this session
    hrExerciseType = LiftCore.HR_EXERCISE_TYPE;
    hrBeginCapture(sid);
  }
  liftRunning = true;
  liftStartTicks();
  navigate(LiftCore.LIFT_ROUTE);
}

// ── the store session (L18): the local copy on every change, a store write when due ──
function liftSnapshot() { return { started_at: liftSession.started_at, ended_at: liftSession.ended_at, meta: liftSession.meta }; }
async function liftWrite(state) {

  mine.pb_id = liftStore.state.pbId; mine.missed = liftStore.state.missed;
  if (liftSession === mine) liftSaveLocal();   // the local copy carries pb_id / missed either way
  return ok;
}
async function liftWriteRetry(state, tries) {
  for (var i = 0; i < (tries || 3); i++) {
    if (await liftWrite(state)) return true;
    if (i + 1 < (tries || 3)) await new Promise(function(r) { setTimeout(r, 2000 * (i + 1)); });
  }
  return false;
}
function liftCommit(meta) {   // a change: the local copy now, the store when due (at most one write per 5 s)

  liftSaveLocal();

}
function liftStartTicks() {

}
function liftTick() {
  if (!liftRunning || !liftSession) { clearInterval(liftTickTimer); return; }
  // L15 (strap): the HR store record's id, stored as soon as it exists (normally the first HR write, at START)

    var l = LiftCore.linkHr(liftSession.meta, hrStore.state.pbId);
    if (l.changed) { liftSession.meta = l.meta; liftStore.touch(); liftSaveLocal(); }
  }
  if (!liftSession.ended_at && !liftFiling && liftStore.due()) liftWrite('active');
  var ss = document.getElementById('lift-store-status');
  if (ss) { ss.textContent = 'lift ' + liftStore.statusText().toLowerCase(); ss.style.color = liftStore.state.missed ? 'var(--state-err)' : ''; }
  var t = document.getElementById('lift-timer');
  if (t) t.textContent = fmtDur(Date.now() - liftSession.started_at);
}
// Page teardown: the local copy, and a keepalive PATCH of the active session (the HR pattern).
function liftFlushOnHide() {
  if (!liftRunning || !liftSession) return;

  if (!db || !liftStore || !liftStore.state.pbId || liftSession.ended_at) return;
  try {
    PB.flush(liftStore.state.pbId, { metadata: LiftCore.checkpointPayload(liftSession.meta, 'active', new Date().toISOString()) });
  } catch (e) { /* best effort: the next tick or the launch recovery covers it */ }
}

// ── FINISH & FILE (L20): the Lift session always files; the HR session never blocks it ──
function liftAskFinish() {

  document.getElementById('lift-overlay').innerHTML = '<div class="overlay" id="lift-finish-overlay"><div class="overlay__box"><div class="overlay__title">Finish and file?</div>' +
    '<div class="overlay__text">' + p.confirmed + ' of ' + p.total + ' sets confirmed.<br>' +
    (left ? '<b>' + left + ' unconfirmed set' + (left > 1 ? 's' : '') + ' will save as skipped (R 0 &middot; W 0).</b><br>' : 'Every set confirmed.<br>') +
    (liftLinkedHr() ? 'The strap session ends and files with it.' : '') + '</div>' +
    '<button class="btn-primary" id="lift-file-btn" onclick="liftFinish()">FILE SESSION</button><div style="height:var(--s-8)"></div>' +
    '<button class="btn-secondary" onclick="liftCloseOverlay()">KEEP LOGGING</button></div></div>';
}
function liftCloseOverlay() { document.getElementById('lift-overlay').innerHTML = ''; }
async function liftFinish() {
  if (liftFiling || !liftSession) return;
  liftFiling = true;
  liftCloseOverlay();
  var btn = document.getElementById('lift-finish-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'FILING…'; }
  liftSession.ended_at = Date.now();
  liftSaveLocal();
  var hrLinked = liftLinkedHr();
  if (hrLinked && hrSessionActive) hrStopCapture();   // one FINISH for both (D-57 (12)): the capture stops, no HR report
  var outcome = await LiftCore.fileBoth(
    function() { return liftWriteRetry('filed', 3); },
    hrLinked ? function() { return hrStoreWriteRetry('filed', null, 3); } : null);   // the HR session files with no note of its own
  var hrPbId = hrLinked && hrStore ? hrStore.state.pbId : null;
  if (outcome.hr_filed === true) { hrClearCheckpoint(); hrResetState(); }
  // outcome.hr_kept: the HR session stays unfiled on the phone and in the store (its checkpoint carries ended_at),
  // for Home's own HR banner (review / file / discard): never claimed filed.
  liftRunning = false;
  clearInterval(liftTickTimer);
  liftFiling = false;
  var pbId = liftStore.state.pbId;
  liftSession = null;
  if (outcome.lift_filed) {
    liftClearLocal();
    liftStore.adopt(null, 0);
    liftLastFiled = { outcome: outcome, hrPbId: hrPbId };
    var rec = await PB.get(pbId);
    if (rec.error || !rec.data) { navigate('#home'); setTimeout(function() { showErr(outcome.text + ' (the record could not be read back)'); autoHideErr(10000); }, 150); return; }
    confirmEntry = rec.data;
    navigate('#confirm');
    return;
  }
  liftStartRetry();   // kept on the phone with its end; retried while the app is open, and FILE on Home's banner
  navigate('#home');
  setTimeout(function() { showErr(outcome.text); autoHideErr(15000); }, 150);
}
// A finished session the store refused: one silent attempt every 30 s while the app is open (L20 "retrying").
function liftStartRetry() {

  liftRetryTimer = setInterval(function() { liftFileKept(false); }, 30000);
}
async function liftFileKept(fromTap) {
  var local = liftGetLocal();
  if (!local || !local.ended_at) { clearInterval(liftRetryTimer); return false; }
  if (liftRunning || liftFiling || !PB.signedIn()) return false;
  liftFiling = true;
  liftSession = local;
  liftStore.adopt(local.pb_id, local.missed);
  liftStore.touch();
  var ok = await liftWrite('filed');
  var pbId = liftStore.state.pbId;
  liftSession = null;
  liftFiling = false;
  if (!ok) {
    if (fromTap) { showErr('the store did not take the Lift session -- kept on this phone; retry'); autoHideErr(8000); }
    return false;
  }
  liftClearLocal();
  liftStore.adopt(null, 0);
  clearInterval(liftRetryTimer);
  if (fromTap) {
    liftLastFiled = { outcome: LiftCore.fileOutcome(true, null), hrPbId: null };
    var rec = await PB.get(pbId);
    if (!rec.error && rec.data) { confirmEntry = rec.data; navigate('#confirm'); return true; }
  }

async function liftDiscardLocal() {

// Launch: the store first, then the phone (HRCore's decision through LiftCore.resumeDecision).
async function liftLaunchRecovery() {
  var dsc = hrGetSlot(LIFT_DISCARD_KEY);
  if (dsc && dsc.discarded_at && Date.now() - dsc.discarded_at > HRCore.DISCARD_KEEP_DAYS * 86400000) {
    try { localStorage.removeItem(LIFT_DISCARD_KEY); } catch (e) {}
  }
  var storeRec = null, storeError = false;
  if (db) {
    var r = await PB.list({ sort: '-started_at', perPage: 5,
      filter: 'entry_type = "' + LiftCore.ENTRY_TYPE + '" && ended_at = "" && metadata.state = "active"' });
    if (r.error || !r.data) storeError = true;
    else storeRec = r.data.filter(LiftCore.isOpenLift)[0] || null;
  } else storeError = true;
  var local = liftGetLocal(), d;
  try { d = LiftCore.resumeDecision({ store: storeRec, local: local, nowMs: Date.now(), storeError: storeError }); }
  catch (e) { return; }
  if (d.action === 'resume' && d.source === 'store' && !local) liftSaveLocalFromStore(d.record, false);
  else if (d.action === 'stale') {   // stopped at its last checkpoint, never resumed (HRCore.STALE_SEC)
    if (d.local) {

      d.local.ended_at = isNaN(last) ? d.local.started_at : last; d.local.pb_id = d.local.pb_id || d.record.id;

  if (now && now.ended_at) liftStartRetry();

  if (now) { if (location.hash === '#home') render(); else location.hash = '#home'; }
}

  var e = liftEditTpl;
  liftSaf(liftSafCell('Template', escHtml(e.name.trim() || '—') + ' &middot; ' + e.lines.length + ' lines'),
          '<button class="btn-primary" id="lift-tpl-save" onclick="liftTplSave()"' + (!e.name.trim() || !e.lines.length ? ' disabled' : '') + '>SAVE TEMPLATE</button>');
}
function liftTplMove(i, d) { liftEditTpl.lines = LiftCore.moveLine(liftEditTpl.lines, i, d); liftPaintTemplate(); }
function liftTplRemove(i) { liftEditTpl.lines.splice(i, 1); liftPaintTemplate(); }
function liftTplAddLine() {
  var el = document.getElementById('lift-ex-name'), name = el ? el.value.trim() : '';
  if (!name) { if (el) el.focus(); return; }
  liftEditTpl.lines = liftEditTpl.lines.concat(LiftCore.linesFor(name, liftNewLat));   // L9: unilateral = two lines, L then R
  liftPaintTemplate();
  var n = document.getElementById('lift-ex-name'); if (n) n.focus();
}
async function liftTplSave() {
  var e = liftEditTpl, btn = document.getElementById('lift-tpl-save');
  var meta;
  try { meta = LiftCore.templateMeta(e.name, e.lines, false); } catch (x) { showErr(x.message); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'SAVING…'; }
  var r;
  if (e.id) r = await PB.update(e.id, { metadata: meta });
  else r = await PB.insert(LiftCore.templateRecord(e.name, e.lines, Date.now()));
  if (r.error || !r.data) {   // Q5: a template is one write, no outbox: without signal it is refused, and said
    if (btn) { btn.disabled = false; btn.textContent = 'SAVE TEMPLATE'; }
    showErr('could not save the template (' + ((r.error && r.error.message) || 'no response') + ') -- it needs signal; retry');
    return;
  }
  liftPick.tplId = r.data.id;
  liftEditTpl = null;
  await liftLoad();
  navigate(LiftCore.LIFT_ROUTE);
}
function liftTplArchiveArm(a) {
  if (a.dataset.armed === '1') { liftTplArchive(); return; }
  a.dataset.armed = '1';
  a.textContent = 'tap again to archive "' + liftEditTpl.name + '"';
  setTimeout(function() { if (a && a.isConnected) { a.dataset.armed = ''; a.textContent = 'archive template'; } }, 4000);
}
async function liftTplArchive() {
  var e = liftEditTpl;
  var r = await PB.update(e.id, { metadata: LiftCore.archiveTemplate(e.meta) });
  if (r.error) { showErr('could not archive the template (' + (r.error.message || 'refused') + ')'); return; }
  if (liftPick.tplId === e.id) liftPick.tplId = null;
  liftEditTpl = null;
  await liftLoad();
  navigate(LiftCore.LIFT_ROUTE);
}

// ── CONFIRM, UNDO, LOG REVIEW ──
function liftReadableRows(meta) {   // values escaped here: the review and the exercise names are free text
  var rows = [], push = function(k, v) { rows.push({ k: escHtml(k), v: escHtml(v) }); };
  push('template', (meta.template && meta.template.name) || '');
  var sm = null;
  try { sm = LiftCore.summary(meta); } catch (e) { sm = null; }
  if (sm) {
    push('status', sm.status);
    push('sets', (sm.n_sets - sm.n_skipped) + ' done · ' + sm.n_skipped + ' skipped');
    push('volume', liftKg(sm.volume_kg) + ' (R×W)');
  }
  push('heart rate', ({ strap: 'strap', link: 'linked', none: 'none' }[meta.hr_mode] || '—') + (meta.hr_session_id ? ' · ' + meta.hr_session_id : ''));
  (meta.exercises || []).forEach(function(e) {
    var sets = (e.sets || []).map(function(s) {
      try { var f = LiftCore.filedSet(s); return f.r === 0 && f.w === 0 ? 'skip' : f.w === 0 ? f.r + ' BW' : f.r + '×' + f.w; } catch (x) { return '?'; }
    });
    push(e.name + (e.side === 'both' ? '' : ' · ' + e.side) + (e.added ? ' (added)' : ''), sets.join(' · '));
  });
  if (meta.review) push('review', meta.review);
  return rows;
}
function liftConfirmHTML(e) {
  var m = e.metadata || {}, o = liftLastFiled && liftLastFiled.outcome;
  var rows = (o ? [{ k: 'filing', v: escHtml(o.text) }] : []).concat(liftReadableRows(m).filter(function(r) { return r.k === 'template' || r.k === 'status' || r.k === 'sets' || r.k === 'volume' || r.k === 'heart rate' || r.k === 'review'; }));
  var all = [], order = 0;
  (m.exercises || []).forEach(function(x) { (x.sets || []).forEach(function(s, i) { all.push({ o: ++order, ex: x.name, side: x.side, n: i + 1, r: s.r, w: s.w }); }); });
  return rows.map(function(r) { return '<div class="confirm-row"><span class="confirm-row__key">' + r.k + '</span><span class="confirm-row__val">' + r.v + '</span></div>'; }).join('') +
    '</div>' +
    '<div class="section">' + liftSecHead('&sect;02', 'Sets as filed', all.length + ' rows') +
      '<div class="kt-wrap"><table class="kt"><tr><th>#</th><th>exercise</th><th>side</th><th>set</th><th>R</th><th>W kg</th><th>R&times;W</th><th></th></tr>' +
      all.map(function(x) {
        var kind = LiftCore.setKind(x.r, x.w);
        return '<tr class="' + (kind === 'skipped' ? 'skip' : '') + '"><td class="num">' + x.o + '</td><td>' + escHtml(x.ex) + '</td><td>' + (x.side === 'both' ? '' : x.side) + '</td>' +
          '<td class="num">' + x.n + '</td><td class="num">' + x.r + '</td><td class="num">' + x.w + '</td><td class="num">' + LiftCore.setVolume(x) + '</td><td>' +
          (kind === 'skipped' ? 'skip' : kind === 'bodyweight' ? 'BW' : '') + '</td></tr>';
      }).join('') + '</table></div></div>';
}
// §3 Q2: a strap-linked session discards its HR session with it, when this FINISH filed that HR session
// (one it did not file is on its own path). Returns the refusal in words, or null.
async function liftUndoLinkedHr(entry) {
  var m = entry.metadata || {};
  if (m.hr_mode !== 'strap' || !liftLastFiled || liftLastFiled.outcome.hr_filed !== true) return null;
  var hrId = m.hr_session_id || liftLastFiled.hrPbId;
  if (!hrId) return null;
  var cur = await PB.get(hrId);
  if (cur.error || !cur.data) return 'the Lift session is discarded; its strap session was not (' + ((cur.error && cur.error.message) || 'no record') + ') -- it is still filed';
  var u = await PB.update(hrId, { metadata: Object.assign({}, cur.data.metadata || {}, { state: 'discarded' }) });
  if (u.error) return 'the Lift session is discarded; its strap session was not (' + (u.error.message || 'refused') + ') -- it is still filed';
  return null;
}
// L18 states: discarded -> filed (restore). The file shape is the core's (an active-shape record files through it, L3).
async function liftRestoreFromReview(id) {
  var r = await PB.get(id);
  if (r.error || !r.data) { showErr('could not load the session from the store'); autoHideErr(4000); return; }
  var body = { metadata: LiftCore.checkpointPayload(r.data.metadata, 'filed', new Date().toISOString()) };
  if (!r.data.ended_at) body.ended_at = new Date().toISOString();
  var u = await PB.update(id, body);
  if (u.error) { showErr('could not restore — retry'); autoHideErr(4000); return; }
  render();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function() {});
}
